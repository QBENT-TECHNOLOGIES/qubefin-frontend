<div class="w-full rounded-3xl overflow-hidden bg-white dark:bg-slate-900 shadow-2xl border border-slate-100 dark:border-slate-800/80">
  <!-- Header -->
  <div class="flex items-center justify-between px-6 pt-5 pb-4 bg-slate-50/80 dark:bg-slate-800/50 border-b border-slate-100 dark:border-slate-800">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-8 h-8 shrink-0 rounded-xl bg-primary-50 dark:bg-primary-500/15 flex items-center justify-center text-primary-600 dark:text-primary-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>
      <h2 mat-dialog-title class="truncate text-base font-bold text-slate-800 dark:text-slate-100 tracking-tight">
        {{ data.title || 'Select Time' }}
      </h2>
    </div>

    <div class="flex shrink-0 items-center gap-2">
      <button
        type="button"
        (click)="setNow()"
        class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-semibold text-primary-600 hover:text-primary-700 bg-primary-50 hover:bg-primary-100 dark:bg-primary-500/15 dark:text-primary-400 dark:hover:bg-primary-500/25 transition-colors duration-200 active:scale-95 cursor-pointer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        Now
      </button>
      <button
        type="button"
        mat-dialog-close
        class="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer"
        aria-label="Close"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <div mat-dialog-content>
    <!-- Readout -->
    <div class="px-5 pt-4">
      <div class="relative bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 text-white py-5 px-4 rounded-2xl shadow-lg border border-slate-700/40 overflow-hidden flex items-center justify-center"
        aria-live="polite">
        <div class="absolute -top-10 -right-10 w-28 h-28 bg-primary-500/20 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-10 -left-10 w-28 h-28 bg-primary-600/15 rounded-full blur-2xl pointer-events-none"></div>

        <div class="relative flex items-center justify-center gap-1.5 font-mono">
          <span class="text-4xl font-extrabold tracking-tight tabular-nums bg-white/10 px-3 py-1 rounded-xl border border-white/15 text-white shadow-inner">
            {{ pad(selectedHour()) }}
          </span>
          <span class="text-3xl font-bold text-primary-400 px-0.5">:</span>
          <span class="text-4xl font-extrabold tracking-tight tabular-nums bg-white/10 px-3 py-1 rounded-xl border border-white/15 text-white shadow-inner">
            {{ pad(selectedMinute()) }}
          </span>
          <span class="ml-2 px-2.5 py-1 text-xs font-black tracking-widest uppercase rounded-lg bg-gradient-to-r from-primary-500 to-primary-600 text-white shadow-md shadow-primary-500/30 border border-primary-400/40">
            {{ selectedPeriod() }}
          </span>
        </div>
      </div>
    </div>

    <!-- Wheels: five 36px rows (180px inside a 1px border, so h-[182px]) with two rows of padding each side, so every value -
         first and last included - can sit in the centre band. -->
    <div class="flex gap-2.5 px-5 pt-4 pb-4">
      <!-- Hours -->
      <div class="flex-1">
        <div class="text-center text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5">
          Hour
        </div>
        <div class="wheel relative h-[182px] rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 overflow-hidden">
          <div class="pointer-events-none absolute inset-x-1.5 top-1/2 -translate-y-1/2 h-9 rounded-xl bg-primary-500/10 dark:bg-primary-400/15 border border-primary-500/25 dark:border-primary-400/30"></div>
          <div
            #hourList
            tabindex="0"
            role="listbox"
            aria-label="Hour"
            class="wheel-list no-scrollbar relative h-full overflow-y-auto overscroll-contain snap-y snap-mandatory py-[72px] rounded-2xl outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary-500/40"
            (scroll)="onHourScroll()"
            (keydown)="onWheelKeydown($event, 'hour')"
          >
            @for (hour of hours; track hour) {
              <button
                type="button"
                tabindex="-1"
                role="option"
                [attr.aria-selected]="selectedHour() === hour"
                (click)="selectHour(hour)"
                class="flex h-9 w-full snap-center items-center justify-center text-sm tabular-nums transition-colors duration-150 cursor-pointer"
                [class]="selectedHour() === hour
                  ? 'font-extrabold text-primary-600 dark:text-primary-400'
                  : 'font-semibold text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'"
              >
                {{ pad(hour) }}
              </button>
            }
          </div>
          <div class="wheel-fade-top"></div>
          <div class="wheel-fade-bottom"></div>
        </div>
      </div>

      <!-- Minutes -->
      <div class="flex-1">
        <div class="text-center text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5">
          Minute
        </div>
        <div class="wheel relative h-[182px] rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 overflow-hidden">
          <div class="pointer-events-none absolute inset-x-1.5 top-1/2 -translate-y-1/2 h-9 rounded-xl bg-primary-500/10 dark:bg-primary-400/15 border border-primary-500/25 dark:border-primary-400/30"></div>
          <div
            #minuteList
            tabindex="0"
            role="listbox"
            aria-label="Minute"
            class="wheel-list no-scrollbar relative h-full overflow-y-auto overscroll-contain snap-y snap-mandatory py-[72px] rounded-2xl outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary-500/40"
            (scroll)="onMinuteScroll()"
            (keydown)="onWheelKeydown($event, 'minute')"
          >
            @for (minute of minutes; track minute) {
              <button
                type="button"
                tabindex="-1"
                role="option"
                [attr.aria-selected]="selectedMinute() === minute"
                (click)="selectMinute(minute)"
                class="flex h-9 w-full snap-center items-center justify-center text-sm tabular-nums transition-colors duration-150 cursor-pointer"
                [class]="selectedMinute() === minute
                  ? 'font-extrabold text-primary-600 dark:text-primary-400'
                  : 'font-semibold text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'"
              >
                {{ pad(minute) }}
              </button>
            }
          </div>
          <div class="wheel-fade-top"></div>
          <div class="wheel-fade-bottom"></div>
        </div>
      </div>

      <!-- AM / PM -->
      <div class="w-16">
        <div class="text-center text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5">
          Period
        </div>
        <div class="h-[182px] rounded-2xl border border-slate-200 dark:border-slate-800 flex flex-col justify-center gap-2 p-1.5 bg-slate-50 dark:bg-slate-900"
          role="radiogroup" aria-label="Period">
          @for (period of periods; track period) {
            <button
              type="button"
              role="radio"
              [attr.aria-checked]="selectedPeriod() === period"
              (click)="selectPeriod(period)"
              class="w-full rounded-xl py-3 text-xs font-bold transition-all duration-200 cursor-pointer"
              [class]="selectedPeriod() === period
                ? 'bg-gradient-to-r from-primary-600 to-primary-700 text-white shadow-md shadow-primary-600/30'
                : 'text-slate-400 dark:text-slate-500 hover:bg-slate-200/60 dark:hover:bg-slate-800/60 hover:text-slate-700 dark:hover:text-slate-300'"
            >
              {{ period }}
            </button>
          }
        </div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div mat-dialog-actions class="flex items-center gap-2.5 justify-end px-6 py-4 bg-slate-50/80 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-800">
    <button
      type="button"
      mat-dialog-close
      class="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:text-slate-800 dark:hover:text-white rounded-xl hover:bg-slate-200/60 dark:hover:bg-slate-700/60 transition-all active:scale-95 cursor-pointer"
    >
      Cancel
    </button>
    <button
      type="button"
      (click)="onConfirm()"
      class="px-5 py-2 text-xs font-bold text-white bg-gradient-to-r from-primary-600 to-primary-700 hover:brightness-95 rounded-xl shadow-md shadow-primary-600/25 hover:shadow-lg hover:shadow-primary-600/35 transition-all duration-200 active:scale-95 flex items-center gap-1.5 cursor-pointer"
    >
      <span>Select</span>
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12l5 5L20 7"/>
      </svg>
    </button>
  </div>
</div>
