<div class="animate-fade-in">
  <div class="flex items-center gap-2">
    <svg lucideIcon="swords" class="w-5 h-5 text-primary-600"></svg>
    <h3 class="text-base font-bold text-slate-800 dark:text-white">
      Microfinance Competition Analysis
    </h3>
  </div>
  <div class="w-10 h-1 rounded-full bg-primary-500 my-4"></div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Name of Institution</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="building-2" class="w-5 h-5"></svg>
      </div>
      <input
        matInput
        [formField]="branchSurveyMicrofinanceCompetitionForm.nameOfInstitution" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Approx. Clients</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="users" class="w-5 h-5"></svg>
      </div>
      <input
        matInput
        type="number"
        [formField]="branchSurveyMicrofinanceCompetitionForm.approxClients" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Approx. Portfolio</mat-label>
      <div class="w-12 flex items-center justify-center gap-1" matPrefix>
        <svg lucideIcon="indian-rupee" class="w-4 h-4"></svg>
        <span class="text-sm font-semibold">₹</span>
      </div>
      <input
        matInput
        type="number"
        [formField]="branchSurveyMicrofinanceCompetitionForm.approxPortfolio" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>PAR %</mat-label>
      <div class="w-12 flex items-center justify-center gap-1" matPrefix>
        <svg lucideIcon="percent" class="w-4 h-4"></svg>
        <span class="text-sm font-semibold">%</span>
      </div>
      <input
        matInput
        type="number"
        [formField]="branchSurveyMicrofinanceCompetitionForm.parpercent" />
    </mat-form-field>
  </div>
</div>
