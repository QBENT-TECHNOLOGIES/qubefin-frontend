<div>
    <div class="flex items-center justify-between gap-3 flex-wrap mb-2">
        <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{{ title() }}</h4>
        @if (hasLocation()) {
        <button type="button" (click)="openInMaps()"
            class="h-8 px-3 rounded-lg border border-slate-200/60 dark:border-white/10 bg-white dark:bg-slate-800 shadow text-xs font-semibold text-slate-700 dark:text-slate-200 inline-flex items-center gap-2 hover:shadow-glass transition cursor-pointer">
            <svg lucideIcon="map-pin" class="w-3.5 h-3.5"></svg>
            Open in Google Maps
        </button>
        }
    </div>

    @if (mapUrl(); as url) {
    <iframe title="Survey location" class="w-full h-60 rounded-xl border-0" [src]="url" loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"></iframe>
    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5">{{ latitude() }}, {{ longitude() }}</p>
    } @else {
    <div class="flex items-center gap-3 rounded-xl border border-slate-200/50 dark:border-white/10 px-4 py-3 text-[13px] text-slate-600 dark:text-slate-300">
        <svg lucideIcon="map-pin" class="w-5 h-5 shrink-0"></svg>
        The location is not saved yet. It appears after the surveyor saves the survey form with a location.
    </div>
    }
</div>
