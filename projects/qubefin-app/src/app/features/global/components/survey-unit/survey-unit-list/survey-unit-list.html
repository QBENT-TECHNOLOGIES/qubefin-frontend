<div class="overflow-auto scroll-thin" [ngClass]="{
  'h-[calc(100vh-170px-72px)] overflow-y-auto': isCollapsed()
}">
  <table mat-table [dataSource]="data()" matSort matSortActive="assignmentNo" matSortDirection="asc" matSortDisableClear
    (matSortChange)="onSortChange($event)" class="w-full table">

    <!-- Sl -->
    <ng-container matColumnDef="sl">
      <th mat-header-cell *matHeaderCellDef>Sl.</th>
      <td mat-cell *matCellDef="let row; let i = index" class="px-3 py-1.5 text-[13px] font-medium dark:text-slate-300">
        {{ pageIndex() * pageSize() + i + 1 }}
      </td>
    </ng-container>

    <!-- Assignment No -->
    <ng-container matColumnDef="assignmentNo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="assignmentNo">Assignment No</th>
      <td mat-cell *matCellDef="let item" lass="px-3 py-1.5 text-[13px] font-medium dark:text-slate-300">
        <div class="flex items-center gap-2"> {{ item.assignmentNo }}</div>
      </td>
    </ng-container>

    <!-- Assigned Date -->
    <ng-container matColumnDef="assignmentDate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="assignmentDate"> Assigned Date </th>
      <td mat-cell *matCellDef="let item"> {{ item.assignmentDate | date }} </td>
    </ng-container>

    <!-- Survey Type -->
    <ng-container matColumnDef="surveyType">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="surveyType"> Survey Type </th>
      <td mat-cell *matCellDef="let item"> {{ item.surveyType}} </td>
    </ng-container>

    <!-- Status -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>

      <td mat-cell *matCellDef="let item"> <span class="px-2 py-1 text-xs rounded font-medium"
          [class.bg-green-100]="item.status" [class.text-green-800]="item.status" [class.bg-red-100]="!item.status"
          [class.text-red-800]="!item.status">
          {{ item.status ? 'Active' : 'Inactive' }}
        </span> </td>
    </ng-container>

    <!-- Action -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef class="text-right!"> Actions</th>
      <td mat-cell *matCellDef="let item">
        <div class="w-full flex justify-end">
          <div class="flex items-center justify-center rounded-full cursor-pointer w-9 h-9 hover:bg-primary-400/10"
            matTooltip="View" (click)="onDetailView(item.id)">
            <svg lucideIcon="chevron-right"
              class="w-5 h-5 text-primary-500 dark:text-primary-500 hover:text-primary-600"></svg>
          </div>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns" [class.bg-primary-500/10]="selectedId()===row.id">
    </tr>

    <tr class="mat-row" *matNoDataRow colspan="6">
      <td class="mat-cell text-center! p-8 italic text-gray-500 border-b-0" [attr.colspan]="columns.length">
        <div class="flex justify-center items-center gap-2">
            <svg lucideIcon="triangle-alert" class="w-5 h-5 text-slate-400"></svg>
            No Survey data found.
        </div>
      </td>
    </tr>
  </table>
  @if (!this.isCollapsed()) {
  <mat-paginator [length]="totalRecords()" [pageSize]="pageSize()" [pageIndex]="pageIndex()"
    [pageSizeOptions]="[10,20,50]" (page)="onPage($event)">
  </mat-paginator>
  }
</div>
