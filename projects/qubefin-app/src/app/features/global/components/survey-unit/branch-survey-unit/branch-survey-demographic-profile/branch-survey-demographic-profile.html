<div class="animate-fade-in">
  <div class="flex items-center gap-2">
    <svg lucideIcon="users" class="w-5 h-5 text-primary-600"></svg>
    <h3 class="text-base font-bold text-slate-800 dark:text-white">
      Demographic Profile
    </h3>
  </div>
  <div class="w-10 h-1 rounded-full bg-primary-500 my-4"></div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Estimated Population</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="users" class="w-5 h-5"></svg>
      </div>
      <input
        matInput
        type="number"
        [value]="getValue('estimatedPopulation')"
        (input)="onNumberInput('estimatedPopulation', $any($event.target).value)" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Number of Households</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="home" class="w-5 h-5"></svg>
      </div>
      <input
        matInput
        type="number"
        [value]="getValue('numberOfHouseholds')"
        (input)="onNumberInput('numberOfHouseholds', $any($event.target).value)" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Average Family Size</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="user-round" class="w-5 h-5"></svg>
      </div>
      <input
        matInput
        type="number"
        [value]="getValue('averageFamilySize')"
        (input)="onNumberInput('averageFamilySize', $any($event.target).value)" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Female Population (%)</mat-label>
      <div class="w-12 flex items-center justify-center gap-1" matPrefix>
        <svg lucideIcon="percent" class="w-4 h-4"></svg>
        <span class="text-sm font-semibold">%</span>
      </div>
      <input
        matInput
        type="number"
        [value]="getValue('femalePopulationPercent')"
        (input)="onNumberInput('femalePopulationPercent', $any($event.target).value)" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Literacy Rate (%)</mat-label>
      <div class="w-12 flex items-center justify-center gap-1" matPrefix>
        <svg lucideIcon="book-open" class="w-4 h-4"></svg>
        <span class="text-sm font-semibold">%</span>
      </div>
      <input
        matInput
        type="number"
        [value]="getValue('literacyRate')"
        (input)="onNumberInput('literacyRate', $any($event.target).value)" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Working Population</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="briefcase" class="w-5 h-5"></svg>
      </div>
      <input
        matInput
        type="number"
        [value]="getValue('workingPopulation')"
        (input)="onNumberInput('workingPopulation', $any($event.target).value)" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Minority Population (%)</mat-label>
      <div class="w-12 flex items-center justify-center gap-1" matPrefix>
        <svg lucideIcon="percent" class="w-4 h-4"></svg>
        <span class="text-sm font-semibold">%</span>
      </div>
      <input
        matInput
        type="number"
        [value]="getValue('minorityPopulationPercent')"
        (input)="onNumberInput('minorityPopulationPercent', $any($event.target).value)" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Scheduled Caste (%)</mat-label>
      <div class="w-12 flex items-center justify-center gap-1" matPrefix>
        <svg lucideIcon="percent" class="w-4 h-4"></svg>
        <span class="text-sm font-semibold">%</span>
      </div>
      <input
        matInput
        type="number"
        [value]="getValue('scheduledCastePercent')"
        (input)="onNumberInput('scheduledCastePercent', $any($event.target).value)" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Scheduled Tribe (%)</mat-label>
      <div class="w-12 flex items-center justify-center gap-1" matPrefix>
        <svg lucideIcon="percent" class="w-4 h-4"></svg>
        <span class="text-sm font-semibold">%</span>
      </div>
      <input
        matInput
        type="number"
        [value]="getValue('scheduledTribePercent')"
        (input)="onNumberInput('scheduledTribePercent', $any($event.target).value)" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Migration Trend</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="trending-up" class="w-5 h-5"></svg>
      </div>
      <input
        matInput
        [value]="getValue('migrationTrend')"
        (input)="onTextInput('migrationTrend', $any($event.target).value)" />
    </mat-form-field>
  </div>
</div>
