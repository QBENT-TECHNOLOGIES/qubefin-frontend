@if (info(); as d) {
@if (d.branchId) {
<!-- The branch exists -->
<div class="rounded-2xl border border-emerald-300/50 bg-emerald-500/5 shadow p-5 flex items-center gap-4">
    <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center shrink-0">
        <svg lucideIcon="building-2" class="w-6 h-6"></svg>
    </div>
    <div class="min-w-0">
        <p class="text-[11px] font-semibold uppercase tracking-wider text-emerald-700 dark:text-emerald-400">Branch created</p>
        <p class="text-base font-bold text-slate-800 dark:text-slate-100 break-words">{{ d.branchName }}</p>
        <p class="text-[13px] text-slate-500 dark:text-slate-400">Branch code: {{ d.branchCode }}</p>
    </div>
</div>
} @else if (d.canCreate) {
<!-- Approved: the Committee Lead creates the branch -->
<div class="rounded-2xl border border-slate-200/40 dark:border-white/10 bg-white/30 dark:bg-glass-dark shadow p-5 flex flex-wrap items-center justify-between gap-4">
    <div>
        <h3 class="text-sm font-bold text-slate-800 dark:text-white">Create Branch</h3>
        <p class="text-[13px] text-slate-500 dark:text-slate-400 mt-1">
            The Managing Director approved this survey. Create the branch now.
        </p>
    </div>
    <button type="button" (click)="openCreate()"
        class="ripple-btn shadow shine-sweep h-11 px-5 rounded-xl inline-flex items-center gap-2 text-[13px] font-semibold text-white bg-gradient-to-r from-primary-500 to-secondary-500 hover:shadow-glow transition lift cursor-pointer">
        <svg lucideIcon="building-2" class="w-4 h-4"></svg>
        Create Branch
    </button>
</div>
}
}
