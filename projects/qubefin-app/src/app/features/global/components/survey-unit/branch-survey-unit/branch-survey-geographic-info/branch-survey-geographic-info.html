<div class="animate-fade-in">
  <div class="flex items-center gap-2">
    <svg lucideIcon="map-pinned" class="w-5 h-5 text-primary-600"></svg>
    <h3 class="text-base font-bold text-slate-800 dark:text-white">
      Geographic Information
    </h3>
  </div>
  <div class="w-10 h-1 rounded-full bg-primary-500 my-4"></div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Date of Survey</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="calendar-check" class="w-5 h-5"></svg>
      </div>
      <input
        matInput
        [matDatepicker]="picker"
        [formField]="branchSurveyGeographicInfoForm.surveyDate" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Proposed Operational Area</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="map" class="w-5 h-5"></svg>
      </div>
      <input
        matInput
        [formField]="branchSurveyGeographicInfoForm.proposedOperationalArea" />
    </mat-form-field>

    <qfin-administrative-unit-cascade
      [columns]="3"
      [administrativeUnitId]="branchSurveyGeographicInfo().administrativeUnitId"
      (selectedIdChanged)="onCascadeChanged($event)">
    </qfin-administrative-unit-cascade>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>PIN Code</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="hash" class="w-5 h-5"></svg>
      </div>
      <input
        matInput
        [formField]="branchSurveyGeographicInfoForm.pinCode" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Latitude</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="locate-fixed" class="w-5 h-5"></svg>
      </div>
      <input
        matInput
        type="number"
        [formField]="branchSurveyGeographicInfoForm.latitude" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Longitude</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="locate-fixed" class="w-5 h-5"></svg>
      </div>
      <input
        matInput
        type="number"
        [formField]="branchSurveyGeographicInfoForm.longitude" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Geo Tag</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="map-pinned" class="w-5 h-5"></svg>
      </div>
      <input
        matInput
        [formField]="branchSurveyGeographicInfoForm.geoTag" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Nearest Landmark</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="landmark" class="w-5 h-5"></svg>
      </div>
      <input
        matInput
        [formField]="branchSurveyGeographicInfoForm.nearestLandmark" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Administrative Status</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="building-2" class="w-5 h-5"></svg>
      </div>
      <mat-select
        [formField]="branchSurveyGeographicInfoForm.administrativeStatus">
        @for (option of adminStatusOptions; track option) {
          <mat-option [value]="option">{{ option }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Distance from Existing WeGrow Branch (km)</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="route" class="w-5 h-5"></svg>
      </div>
      <input
        matInput
        type="number"
        [formField]="branchSurveyGeographicInfoForm.distanceFromExistingWeGrowBranch" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Distance from District Headquarters (km)</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="route" class="w-5 h-5"></svg>
      </div>
      <input
        matInput
        type="number"
        [formField]="branchSurveyGeographicInfoForm.distanceFromDistrictHeadquarters" />
    </mat-form-field>
  </div>
</div>
