<div class="glass rounded-xl shadow-glass dark:shadow px-5 pt-4 pb-2 flex-1 transition-all">
    <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-400/10 pb-3 mb-4">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div
                    class="w-14 h-14 rounded-xl shadow-md bg-primary-500/10 dark:bg-primary-500/20 flex items-center justify-center dark:shadow-none">

                    <svg lucideIcon="square-pen" class="w-5 h-5 text-primary-700 dark:text-primary-400"></svg>

                </div>
                <div>
                    <div class="flex justify-start gap-2">
                        <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100">
                            Complete Survey
                        </h2>
                        <div
                            class="flex items-center gap-1.5 px-3 pt-1 pb-0 rounded-xl bg-blue-500/5 dark:bg-blue-400/5 border border-blue-500/10 dark:border-blue-400/10 shadow-inner">
                            <span class="w-1.5 h-1.5 rounded-full bg-blue-500 dark:bg-blue-400"></span>
                            <span
                                class="text-[10px] font-semibold text-blue-600 dark:text-blue-400 uppercase tracking-wider">

                                Edit Mode
                            </span>
                        </div>
                    </div>
                    <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">
                        Complete the selected survey.
                    </p>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button aria-label="Close" matTooltip="Close"
                class="w-10 h-10 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition cursor-pointer"
                (click)="closePanel()">
                <svg lucideIcon="x" class="w-4 h-4"></svg>
            </button>
        </div>
    </div>

    <div class="">
        <div class="flex-1 overflow-y-auto overflow-x-hidden scroll-thin min-h-0 min-w-0">
            <mat-stepper linear #stepper class="scrollable-stepper-header bg-transparent" [class.dark-stepper]="true">
                <!-- Completed -->
                <ng-template matStepperIcon="done">
                    <svg lucideIcon="check" class="w-3 h-3 text-white-600">
                    </svg>
                </ng-template>

                <!-- Editable -->
                <ng-template matStepperIcon="edit">
                    <svg lucideIcon="pencil" class="w-3 h-3 text-white-600">
                    </svg>
                </ng-template>
                <!-- Step 1: Geographic Information -->
                <mat-step label="Geographic Information">
                    <div class="bg-white/20 dark:bg-glass-dark rounded-xl shadow dark:shadow">
                        <div class="p-5">
                            <qfin-branch-survey-geographic-info [model]="formModel()"
                                (fieldUpdated)="onChildFieldUpdated($event)">
                            </qfin-branch-survey-geographic-info>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 mt-4">
                        <button matStepperNext type="button"
                            class="ripple-btn shadow shine-sweep rounded-lg px-5 py-2.5 flex items-center gap-2 text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-secondary-500 hover:shadow-glow transition lift cursor-pointer">
                            Next
                            <svg lucideIcon="arrow-right" class="w-4 h-4"></svg>
                        </button>
                    </div>
                </mat-step>

                <!-- Step 2: Accessibility Assessment -->
                <mat-step label="Accessibility Assessment">
                    <div class="bg-white/20 dark:bg-glass-dark rounded-xl shadow dark:shadow">
                        <div class="p-5">
                            <qfin-branch-survey-accessibility-assessment [model]="formModel()"
                                (fieldUpdated)="onChildFieldUpdated($event)">
                            </qfin-branch-survey-accessibility-assessment>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 mt-4">
                        <button matStepperPrevious type="button"
                            class="bg-white shadow rounded-lg px-4 py-2.5 flex items-center gap-2 text-sm font-medium hover:shadow-glass transition lift shine-sweep cursor-pointer">
                            <svg lucideIcon="arrow-left" class="w-4 h-4"></svg>
                            Back
                        </button>
                        <button matStepperNext type="button"
                            class="ripple-btn shadow shine-sweep rounded-lg px-5 py-2.5 flex items-center gap-2 text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-secondary-500 hover:shadow-glow transition lift cursor-pointer">
                            Next
                            <svg lucideIcon="arrow-right" class="w-4 h-4"></svg>
                        </button>
                    </div>
                </mat-step>

                <!-- Step 3: Demographic Profile -->
                <mat-step label="Demographic Profile">
                    <div class="bg-white/20 dark:bg-glass-dark rounded-xl shadow dark:shadow">
                        <div class="p-5">
                            <qfin-branch-survey-demographic-profile [model]="formModel()"
                                (fieldUpdated)="onChildFieldUpdated($event)">
                            </qfin-branch-survey-demographic-profile>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 mt-4">
                        <button matStepperPrevious type="button"
                            class="bg-white shadow rounded-lg px-4 py-2.5 flex items-center gap-2 text-sm font-medium hover:shadow-glass transition lift shine-sweep cursor-pointer">
                            <svg lucideIcon="arrow-left" class="w-4 h-4"></svg>
                            Back
                        </button>
                        <button matStepperNext type="button"
                            class="ripple-btn shadow shine-sweep rounded-lg px-5 py-2.5 flex items-center gap-2 text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-secondary-500 hover:shadow-glow transition lift cursor-pointer">
                            Next
                            <svg lucideIcon="arrow-right" class="w-4 h-4"></svg>
                        </button>
                    </div>
                </mat-step>

                <!-- Step 4: Economic Profile -->
                <mat-step label="Economic Profile">
                    <div class="bg-white/20 dark:bg-glass-dark rounded-xl shadow dark:shadow">
                        <div class="p-5">
                            <qfin-branch-survey-economic-profile [model]="formModel()"
                                (fieldUpdated)="onChildFieldUpdated($event)">
                            </qfin-branch-survey-economic-profile>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 mt-4">
                        <button matStepperPrevious type="button"
                            class="bg-white shadow rounded-lg px-4 py-2.5 flex items-center gap-2 text-sm font-medium hover:shadow-glass transition lift shine-sweep cursor-pointer">
                            <svg lucideIcon="arrow-left" class="w-4 h-4"></svg>
                            Back
                        </button>
                        <button matStepperNext type="button"
                            class="ripple-btn shadow shine-sweep rounded-lg px-5 py-2.5 flex items-center gap-2 text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-secondary-500 hover:shadow-glow transition lift cursor-pointer">
                            Next
                            <svg lucideIcon="arrow-right" class="w-4 h-4"></svg>
                        </button>
                    </div>
                </mat-step>

                <!-- Step 5: Market Potential Assessment -->
                <mat-step label="Market Potential Assessment">
                    <div class="bg-white/20 dark:bg-glass-dark rounded-xl shadow dark:shadow">
                        <div class="p-5">
                            <qfin-branch-survey-market-potential [model]="formModel()"
                                (fieldUpdated)="onChildFieldUpdated($event)">
                            </qfin-branch-survey-market-potential>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 mt-4">
                        <button matStepperPrevious type="button"
                            class="bg-white shadow rounded-lg px-4 py-2.5 flex items-center gap-2 text-sm font-medium hover:shadow-glass transition lift shine-sweep cursor-pointer">
                            <svg lucideIcon="arrow-left" class="w-4 h-4"></svg>
                            Back
                        </button>
                        <button matStepperNext type="button"
                            class="ripple-btn shadow shine-sweep rounded-lg px-5 py-2.5 flex items-center gap-2 text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-secondary-500 hover:shadow-glow transition lift cursor-pointer">
                            Next
                            <svg lucideIcon="arrow-right" class="w-4 h-4"></svg>
                        </button>
                    </div>
                </mat-step>

                <!-- Step 6: Transportation Facilities -->
                <mat-step label="Transportation Facilities">
                    <div class="bg-white/20 dark:bg-glass-dark rounded-xl shadow dark:shadow">
                        <div class="p-5">
                            <qfin-branch-survey-transportation-facilities [model]="formModel()"
                                (fieldUpdated)="onChildFieldUpdated($event)">
                            </qfin-branch-survey-transportation-facilities>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 mt-4">
                        <button matStepperPrevious type="button"
                            class="bg-white shadow rounded-lg px-4 py-2.5 flex items-center gap-2 text-sm font-medium hover:shadow-glass transition lift shine-sweep cursor-pointer">
                            <svg lucideIcon="arrow-left" class="w-4 h-4"></svg>
                            Back
                        </button>
                        <button matStepperNext type="button"
                            class="ripple-btn shadow shine-sweep rounded-lg px-5 py-2.5 flex items-center gap-2 text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-secondary-500 hover:shadow-glow transition lift cursor-pointer">
                            Next
                            <svg lucideIcon="arrow-right" class="w-4 h-4"></svg>
                        </button>
                    </div>
                </mat-step>

                <!-- Step 7: Financial Inclusion Status -->
                <mat-step label="Financial Inclusion Status">
                    <div class="bg-white/20 dark:bg-glass-dark rounded-xl shadow dark:shadow">
                        <div class="p-5">
                            <qfin-branch-survey-financial-inclusion [model]="formModel()"
                                (fieldUpdated)="onChildFieldUpdated($event)">
                            </qfin-branch-survey-financial-inclusion>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 mt-4">
                        <button matStepperPrevious type="button"
                            class="bg-white shadow rounded-lg px-4 py-2.5 flex items-center gap-2 text-sm font-medium hover:shadow-glass transition lift shine-sweep cursor-pointer">
                            <svg lucideIcon="arrow-left" class="w-4 h-4"></svg>
                            Back
                        </button>
                        <button matStepperNext type="button"
                            class="ripple-btn shadow shine-sweep rounded-lg px-5 py-2.5 flex items-center gap-2 text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-secondary-500 hover:shadow-glow transition lift cursor-pointer">
                            Next
                            <svg lucideIcon="arrow-right" class="w-4 h-4"></svg>
                        </button>
                    </div>
                </mat-step>

                <!-- Step 8: Microfinance Competition Analysis -->
                <mat-step label="Microfinance Competition Analysis">
                    <div class="bg-white/20 dark:bg-glass-dark rounded-xl shadow dark:shadow">
                        <div class="p-5">
                            <qfin-branch-survey-competition-analysis [model]="formModel()"
                                (fieldUpdated)="onChildFieldUpdated($event)">
                            </qfin-branch-survey-competition-analysis>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 mt-4">
                        <button matStepperPrevious type="button"
                            class="bg-white shadow rounded-lg px-4 py-2.5 flex items-center gap-2 text-sm font-medium hover:shadow-glass transition lift shine-sweep cursor-pointer">
                            <svg lucideIcon="arrow-left" class="w-4 h-4"></svg>
                            Back
                        </button>
                        <button matStepperNext type="button"
                            class="ripple-btn shadow shine-sweep rounded-lg px-5 py-2.5 flex items-center gap-2 text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-secondary-500 hover:shadow-glow transition lift cursor-pointer">
                            Next
                            <svg lucideIcon="arrow-right" class="w-4 h-4"></svg>
                        </button>
                    </div>
                </mat-step>

                <!-- Step 9: Business Potential Assessment -->
                <mat-step label="Business Potential Assessment">
                    <div class="bg-white/20 dark:bg-glass-dark rounded-xl shadow dark:shadow">
                        <div class="p-5">
                            <qfin-branch-survey-business-potential [model]="formModel()"
                                (fieldUpdated)="onChildFieldUpdated($event)">
                            </qfin-branch-survey-business-potential>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 mt-4">
                        <button matStepperPrevious type="button"
                            class="bg-white shadow rounded-lg px-4 py-2.5 flex items-center gap-2 text-sm font-medium hover:shadow-glass transition lift shine-sweep cursor-pointer">
                            <svg lucideIcon="arrow-left" class="w-4 h-4"></svg>
                            Back
                        </button>
                        <button matStepperNext type="button"
                            class="ripple-btn shadow shine-sweep rounded-lg px-5 py-2.5 flex items-center gap-2 text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-secondary-500 hover:shadow-glow transition lift cursor-pointer">
                            Next
                            <svg lucideIcon="arrow-right" class="w-4 h-4"></svg>
                        </button>
                    </div>
                </mat-step>

                <!-- Step 10: Risk Assessment -->
                <mat-step label="Risk Assessment">
                    <div class="bg-white/20 dark:bg-glass-dark rounded-xl shadow dark:shadow">
                        <div class="p-5">
                            <qfin-branch-survey-risk-assessment [model]="formModel()"
                                (fieldUpdated)="onChildFieldUpdated($event)">
                            </qfin-branch-survey-risk-assessment>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 mt-4">
                        <button matStepperPrevious type="button"
                            class="bg-white shadow rounded-lg px-4 py-2.5 flex items-center gap-2 text-sm font-medium hover:shadow-glass transition lift shine-sweep cursor-pointer">
                            <svg lucideIcon="arrow-left" class="w-4 h-4"></svg>
                            Back
                        </button>
                        <button matStepperNext type="button"
                            class="ripple-btn shadow shine-sweep rounded-lg px-5 py-2.5 flex items-center gap-2 text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-secondary-500 hover:shadow-glow transition lift cursor-pointer">
                            Next
                            <svg lucideIcon="arrow-right" class="w-4 h-4"></svg>
                        </button>
                    </div>
                </mat-step>

                <!-- Step 11: Compliance Verification -->
                <mat-step label="Compliance Verification">
                    <div class="bg-white/20 dark:bg-glass-dark rounded-xl shadow dark:shadow">
                        <div class="p-5">
                            <qfin-branch-survey-compliance-verification [model]="formModel()"
                                (fieldUpdated)="onChildFieldUpdated($event)">
                            </qfin-branch-survey-compliance-verification>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 mt-4">
                        <button matStepperPrevious type="button"
                            class="bg-white shadow rounded-lg px-4 py-2.5 flex items-center gap-2 text-sm font-medium hover:shadow-glass transition lift shine-sweep cursor-pointer">
                            <svg lucideIcon="arrow-left" class="w-4 h-4"></svg>
                            Back
                        </button>
                        <button matStepperNext type="button"
                            class="ripple-btn shadow shine-sweep rounded-lg px-5 py-2.5 flex items-center gap-2 text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-secondary-500 hover:shadow-glow transition lift cursor-pointer">
                            Next
                            <svg lucideIcon="arrow-right" class="w-4 h-4"></svg>
                        </button>
                    </div>
                </mat-step>

                <!-- Step 12: Recommendation -->
                <mat-step label="Recommendation">
                    <div class="bg-white/20 dark:bg-glass-dark rounded-xl shadow dark:shadow">
                        <div class="p-5">
                            <qfin-branch-survey-recommendation [model]="formModel()"
                                (fieldUpdated)="onChildFieldUpdated($event)">
                            </qfin-branch-survey-recommendation>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 mt-4">
                        <button matStepperPrevious type="button"
                            class="bg-white shadow rounded-lg px-4 py-2.5 flex items-center gap-2 text-sm font-medium hover:shadow-glass transition lift shine-sweep cursor-pointer">
                            <svg lucideIcon="arrow-left" class="w-4 h-4"></svg>
                            Back
                        </button>
                        <button type="button" (click)="onSubmit()"
                            class="ripple-btn shadow shine-sweep rounded-lg px-5 py-2.5 flex items-center gap-2 text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-secondary-500 hover:shadow-glow transition lift cursor-pointer">
                            <svg lucideIcon="save" class="w-4 h-4"></svg>
                            {{ isEditMode() ? 'Update' : 'Submit' }}
                        </button>
                    </div>
                </mat-step>
            </mat-stepper>
        </div>
    </div>
</div>
