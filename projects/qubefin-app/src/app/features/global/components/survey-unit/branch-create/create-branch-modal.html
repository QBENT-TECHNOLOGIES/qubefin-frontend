<div
  class="flex items-center justify-between px-5 py-3 bg-white/60 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
  <div class="flex items-center gap-4">
    <div
      class="flex items-center justify-center w-12 h-12 rounded-full bg-indigo-50 dark:bg-secondary-600/50 text-indigo-600 dark:text-indigo-500 border border-indigo-100 dark:border-0">
      <svg lucideIcon="building-2" class="w-6 h-6"></svg>
    </div>
    <div>
      <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 leading-tight">Create Branch</h2>
      <p class="text-sm text-slate-500 font-medium mt-1">
        From survey area <span class="text-slate-700 dark:text-slate-300 font-semibold">{{ info.suggestedName }}</span>.
        The branch code is generated automatically.
      </p>
    </div>
  </div>
  <button (click)="dialogRef.close(false)"
    class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-full transition-colors cursor-pointer focus:outline-none">
    <svg lucideIcon="x" class="w-5 h-5"></svg>
  </button>
</div>

<mat-dialog-content class="p-5!">
  <qfin-organization-unit-detail-component [surveyId]="surveyId" [branchInfo]="info" (saved)="dialogRef.close(true)"
    (cancel)="dialogRef.close(false)">
  </qfin-organization-unit-detail-component>
</mat-dialog-content>
