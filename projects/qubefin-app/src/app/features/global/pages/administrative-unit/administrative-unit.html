<qfin-breadcrumb></qfin-breadcrumb>

<div class="flex gap-4 items-stretch">

    <!-- Left Panel -->
    <aside class="w-80 md:w-80 shrink-0 sticky top-0 self-start">
        <div class="glass rounded-xl h-[calc(100vh-150px)] shadow-glass dark:shadow flex flex-col overflow-hidden">
            <!-- Fixed Header -->
            <div class="flex justify-between shrink-0 px-6 py-3">
                <h1 class="text-lg font-bold text-slate-800 dark:text-slate-100">
                    Administrative Units
                </h1>

                <!-- <button
                    type="button"
                    (click)="onAdd()"
                    class="inline-flex items-center gap-1.5 rounded-xl border border-blue-500/30 dark:border-blue-400/20 bg-blue-600/10 dark:bg-blue-500/20 px-3.5 py-1.5 text-sm font-semibold text-blue-600 dark:text-blue-400 hover:bg-blue-600 hover:text-white transition-all">
                    <span class="material-symbols-outlined text-[18px]">add</span>
                </button> -->
                <div class="p-2 bg-secondary-500/10 dark:bg-primary-400/20 rounded-4xl hover:shadow-glow lift cursor-pointer" (click)="onAdd()" matTooltip="Add Unit">
                    <svg lucidePlus class="w-5 h-5 text-secondary-500 dark:text-white"></svg>
                </div>
            </div>
            <div class="flex items-center gap-2 mb-4 px-4">
                <div class="flex-1 flex items-center gap-2 bg-white dark:bg-slate-500/10 border border-slate-200 dark:border-slate-400/10 rounded-xl px-3 py-2.5">
                    <svg lucideSearch class="w-4 h-4 text-slate-400 shrink-0"></svg>
                    <input type="text" placeholder="Search units..." aria-label="Search administrative units"
                        class="bg-transparent outline-none text-sm w-full placeholder:text-slate-400" />
                </div>
                <button aria-label="Filter"
                    class="bg-white dark:bg-primary-400/20 dark:text-primary-500 border dark:border-0 border-slate-200 cursor-pointer rounded-xl w-10 h-10 flex items-center justify-center shrink-0 hover:shadow-glass transition lift">
                    <svg lucideFunnel class="w-4 h-4"></svg>
                </button>
            </div>
            <!-- Only Tree Scroll -->
            <div class="flex-1 overflow-y-auto min-h-0 scroll-thin">
                <qfin-administrative-unit-tree
                    [administrativeUnitTreeNodes]="administrativeUnitTreeNodes()"
                    (onViewDetail)="viewDetail($event)">
                </qfin-administrative-unit-tree>
            </div>
        </div>
    </aside>

    <!-- Right Panel -->
    <section class="flex-1">

        @if (isViewMode()) {

        <qfin-administrative-unit-view
            [administrativeUnitId]="selectedAdministrativeUnitId()"
            (showEdit)="onEdit()">
        </qfin-administrative-unit-view>

        } @else {

        <qfin-administrative-unit-detail
            [administrativeUnitId]="selectedAdministrativeUnitId()"
            (cancel)="isViewMode.set(true)">
        </qfin-administrative-unit-detail>

        }

    </section>

</div>
