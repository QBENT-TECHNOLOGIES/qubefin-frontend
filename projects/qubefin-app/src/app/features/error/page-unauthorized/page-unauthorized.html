<!-- ═══════════════════════════════════════════════════════════════
     BACKGROUND — Gradient Mesh + Animated Orbs
     ═══════════════════════════════════════════════════════════════ -->
<div class="fixed inset-0 overflow-hidden bg-gradient-to-br from-slate-50 via-green-50/30 to-blue-50/20
            dark:from-slate-950 dark:via-slate-900 dark:to-slate-950">

    <!-- Animated orbs -->
    <div class="absolute -top-32 -left-32 w-[500px] h-[500px] rounded-full
                bg-primary-500/12 dark:bg-primary-500/8 blur-[100px]
                animate-float"></div>

    <div class="absolute -bottom-40 -right-40 w-[460px] h-[460px] rounded-full
                bg-secondary-500/12 dark:bg-secondary-500/8 blur-[100px]
                animate-float-slow"></div>

    <div class="absolute top-1/3 right-1/4 w-[300px] h-[300px] rounded-full
                bg-accent-500/8 dark:bg-accent-500/5 blur-[80px]
                animate-float" style="animation-delay: -4s"></div>

    <!-- Subtle grid pattern overlay -->
    <div class="absolute inset-0 opacity-[0.03] dark:opacity-[0.04]"
         style="background-image: radial-gradient(circle, #64748b 1px, transparent 1px);
                background-size: 32px 32px;"></div>

</div>

<!-- ═══════════════════════════════════════════════════════════════
     MAIN CONTENT
     ═══════════════════════════════════════════════════════════════ -->
<div class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 py-12">

    <!-- ─── Glass Outline 404 ─── -->
    <div class="relative mb-6 select-none">

        <!-- Glow ring behind the text -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2
                    w-64 h-64 rounded-full
                    bg-gradient-to-br from-primary-500/20 via-secondary-500/15 to-accent-500/20
                    blur-[60px] animate-float"></div>

        <!-- Orbital decorative rings -->
        <div class="notfound-orbit notfound-orbit--1"></div>
        <div class="notfound-orbit notfound-orbit--2"></div>

        <!-- The 404 text — glass outline effect -->
        <h1 class="notfound-hero-text relative">
            401
        </h1>

    </div>

    <!-- ─── Glass Card ─── -->
    <div class="notfound-card rounded-3xl p-8 sm:p-10 max-w-md w-full
                animate-fade-in-up" style="animation-delay: .12s">

        <!-- Title -->
        <h2 class="text-2xl sm:text-3xl font-bold text-center text-slate-900 dark:text-white mb-3">
            No authorization found.
        </h2>

        <!-- Description -->
        <p class="text-center text-slate-500 dark:text-slate-400 leading-relaxed text-sm sm:text-base mb-8">
            This page is not publically available.<br/>
            To access it please login first.
        </p>

        <!-- Leaf divider (matching login page) -->
        <div class="flex items-center justify-center gap-4 mb-8">
            <div class="w-16 h-px bg-gradient-to-r from-transparent to-primary-500/50"></div>
            <span class="text-primary-500 text-lg">🍃</span>
            <div class="w-16 h-px bg-gradient-to-l from-transparent to-primary-500/50"></div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">

            <!-- Primary: Go Home -->
            <button (click)="goHome()"
                    class="notfound-btn-primary group
                           inline-flex items-center gap-2.5 px-7 py-3 rounded-lg font-semibold text-white
                           bg-gradient-to-r from-primary-500 to-primary-600
                           shadow-glow/40 hover:shadow-glow
                           transition-all duration-300 cursor-pointer
                           shine-sweep">
                <svg lucideIcon="house" class="w-[18px] h-[18px] transition-transform duration-300 group-hover:scale-110"></svg>
                <span>Go to Home</span>
        </button>

        </div>

    </div>

</div>
