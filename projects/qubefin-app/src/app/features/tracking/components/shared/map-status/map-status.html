<div class="trk-map-placeholder" [style.height]="height()">
    @switch (maps.status()) {
    @case ('no-key') {
    <svg lucideIcon="map-pin-off" class="w-8 h-8 text-amber-500"></svg>
    <p class="font-semibold text-slate-700 dark:text-slate-200">Map not configured</p>
    <p class="text-xs text-slate-500 max-w-sm text-center">
        Add <code>MAP_API_KEY</code> to the environment file to show the map. Everything else on this page still works.
    </p>
    }
    @case ('error') {
    <svg lucideIcon="octagon-alert" class="w-8 h-8 text-rose-500"></svg>
    <p class="font-semibold text-slate-700 dark:text-slate-200">Map unavailable</p>
    <p class="text-xs text-slate-500 max-w-sm text-center">{{ maps.errorMessage() }}</p>
    }
    @default {
    <div class="w-8 h-8 border-4 border-primary-500 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-xs text-slate-500">Loading map…</p>
    }
    }
</div>
