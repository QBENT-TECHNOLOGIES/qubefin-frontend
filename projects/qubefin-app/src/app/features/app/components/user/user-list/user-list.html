<div class="overflow-auto scrollbar-thin" [ngClass]="{
        'h-[calc(100vh-170px-72px)] overflow-y-auto': isCollapsed()
    }">
    <table mat-table [dataSource]="data().users" matSort (matSortChange)="sortChange.emit($event)" class="w-full table">

        <ng-container matColumnDef="index">
            <th mat-header-cell *matHeaderCellDef> No. </th>
            <td mat-cell *matCellDef="let element;  let i = index"
                class="px-3 py-1.5 text-[13px] font-medium dark:text-slate-300">
                {{ pageIndex() * pageSize() + i + 1 }}
            </td>
        </ng-container>

        <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> User Name </th>
            <td mat-cell *matCellDef="let element"> {{element.userName}} </td>
        </ng-container>

        <ng-container matColumnDef="employee">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Employee </th>
            <td mat-cell *matCellDef="let element"> {{element.employee}} </td>
        </ng-container>

        <ng-container matColumnDef="mfakey">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> MFA Key </th>
            <td mat-cell *matCellDef="let element"> {{element.mfaSecret}} </td>
        </ng-container>

        <ng-container matColumnDef="mfaenabled">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> MFA Enabled? </th>
            <td mat-cell *matCellDef="let element">
                <qfin-status-badge-component [text]="element.hasMfaEnabled ? 'Enabled' : 'Disabled'">
                </qfin-status-badge-component>
            </td>
        </ng-container>

        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Status </th>
            <td mat-cell *matCellDef="let element">
                <qfin-status-badge-component [text]="element.isActive ? 'Active' : 'Inactive'">
                </qfin-status-badge-component>
                <!-- <span class="px-2 py-1 text-xs rounded font-medium" [class.bg-green-100]="element.isActive"
                    [class.text-green-800]="element.isActive" [class.bg-red-100]="!element.isActive"
                    [class.text-red-800]="!element.isActive">
                    {{ element.isActive ? 'Active' : 'Inactive' }}
                </span> -->
            </td>
        </ng-container>

        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="text-right!"> Action </th>
            <td mat-cell *matCellDef="let element">
                <div class="w-full flex justify-end">
                    <div class="flex items-center justify-center rounded-full cursor-pointer w-9 h-9 hover:bg-primary-400/10"
                        matTooltip="View" (click)="onShowDetail(element.id)">
                        <svg lucideIcon="chevron-right"
                            class="w-5 h-5 text-primary-500 dark:text-primary-500 hover:text-primary-600"></svg>
                    </div>
                </div>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns();" [class.bg-primary-500]="selectedId() === row.id"
            [class.bg-opacity-10]="selectedId() === row.id" class="transition-colors"></tr>
    </table>
    <mat-paginator [length]="data().totalCount" [pageIndex]="pageIndex()" [pageSize]="pageSize()"
        [pageSizeOptions]="[1, 5, 10, 20]" (page)="pageChange.emit($event)"
        aria-label="Select page of periodic elements">
    </mat-paginator>
</div>
