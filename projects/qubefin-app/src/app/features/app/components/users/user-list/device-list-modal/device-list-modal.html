<div
    class="flex items-center justify-between px-5 py-3 bg-white/60 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
    <div class="flex items-center gap-4">
        <div
            class="flex items-center justify-center w-12 h-12 rounded-full bg-indigo-50 dark:bg-secondary-600/50 text-indigo-600 dark:text-indigo-500 border border-indigo-100 dark:border-0">
            <svg lucideIcon="smartphone" class="w-6 h-6"></svg>
        </div>
        <div>
            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 leading-tight">
                Device List
            </h2>
        </div>
    </div>
    <button (click)="onCancel()"
        class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-full transition-colors cursor-pointer focus:outline-none">
        <svg lucideIcon="x" class="w-5 h-5"></svg>
    </button>
</div>
<div class="box glass p-4 pb-6 m-2">
    <div class="flex flex-col gap-3">


        <div class="table-box" style="max-height: 275px;">
            <table mat-table [dataSource]="deviceList()" matSortDisableClear class="w-full table">
                <ng-container matColumnDef="sl">
                    <th mat-header-cell *matHeaderCellDef>Sl.</th>
                    <td mat-cell *matCellDef="let row; let i = index"
                        class="px-3 py-1.5 text-[13px] font-medium dark:text-slate-300">
                        {{ i + 1 }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="deviceId">
                    <th mat-header-cell *matHeaderCellDef>Device Id</th>
                    <td mat-cell *matCellDef="let item">
                        {{ item.deviceId }}
                    </td>
                </ng-container>
                <ng-container matColumnDef="assignedDate">
                    <th mat-header-cell *matHeaderCellDef>Assigned Date</th>
                    <td mat-cell *matCellDef="let item">
                        {{ item.assignDate | date: 'dd-MM-yyyy' }}
                    </td>
                </ng-container>
                <ng-container matColumnDef="isReleased">
                    <th mat-header-cell *matHeaderCellDef>Is Released</th>
                    <td mat-cell *matCellDef="let item">
                        <span class="px-2 py-1 text-xs rounded font-medium" [class.bg-green-100]="item.isRelease"
                            [class.text-green-800]="item.isRelease" [class.bg-red-100]="!item.isRelease"
                            [class.text-red-800]="!item.isRelease">
                            {{ item.isRelease ? 'Yes' : 'No' }}
                        </span>
                    </td>

                </ng-container>
                <ng-container matColumnDef="releaseDate">
                    <th mat-header-cell *matHeaderCellDef>Release Date</th>
                    <td mat-cell *matCellDef="let item">
                        {{ item.releaseDate | date: 'dd-MM-yyyy' }}
                    </td>
                </ng-container>
                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef class="text-right!"> Action </th>
                    <td mat-cell *matCellDef="let item">
                        @if(!item.isRelease){
                        <div class="w-full flex justify-end">
                            <div class="flex items-center justify-center rounded-full cursor-pointer w-9 h-9 hover:bg-primary-400/10"
                                matTooltip="Unbind Device" (click)="unbindDevice(item.id)">
                                <svg lucideIcon="unlink"
                                    class="w-5 h-5 text-primary-500 dark:text-primary-500 hover:text-primary-600"></svg>
                            </div>
                        </div>
                        }
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns(); sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>

                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell text-center! p-8 italic text-gray-500 border-b-0"
                        [attr.colspan]="displayedColumns().length">
                        <div class="flex justify-center items-center gap-2">
                            <svg lucideIcon="triangle-alert" class="w-5 h-5 text-slate-400"></svg>
                            No Device data found.
                        </div>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
<div class="box glass p-4 pb-6 m-2 mt-0 flex justify-end">
    <button (click)="onCancel()"
        class="cursor-pointer px-5 py-2.5 flex items-center gap-2 bg-white border border-slate-300 hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 text-slate-700 text-sm font-semibold rounded-lg shadow-sm transition-all disabled:opacity-60 disabled:cursor-not-allowed">
        <svg lucideIcon="x" class="w-4 h-4"></svg>
        Cancel
    </button>
</div>
