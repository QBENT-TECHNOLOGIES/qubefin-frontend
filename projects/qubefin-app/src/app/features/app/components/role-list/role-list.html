<div class="overflow-auto scrollbar-thin" [ngClass]="{
        'h-[calc(100vh-170px-72px)] overflow-y-auto': isCollapsed()
    }">

    <table mat-table [dataSource]="data()" matSort (matSortChange)="sortChange.emit($event)" class="w-full table">

        <ng-container matColumnDef="index">
            <th mat-header-cell *matHeaderCellDef> No. </th>
            <td mat-cell *matCellDef="let element" class="px-3 py-1.5 text-[13px] font-medium dark:text-slate-300"> 1
            </td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Name </th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>

        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Status </th>
            <td mat-cell *matCellDef="let element">
                <span class="px-2 py-1 text-xs rounded font-medium" [class.bg-green-100]="element.isActive"
                    [class.text-green-800]="element.isActive" [class.bg-red-100]="!element.isActive"
                    [class.text-red-800]="!element.isActive">
                    {{ element.isActive ? 'Active' : 'Inactive' }}
                </span>
            </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="text-right!"> Action </th>
            <td mat-cell *matCellDef="let element">
                <div class="w-full flex justify-end">
                    <div class="flex items-center justify-center rounded-full cursor-pointer w-9 h-9 hover:bg-primary-400/10"
                        matTooltip="View">
                        <svg lucideIcon="chevron-right"
                            class="w-5 h-5 text-primary-500 dark:text-primary-500 hover:text-primary-600"></svg>
                    </div>
                </div>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons (page)="pageChange.emit($event)"
                 aria-label="Select page of periodic elements">
  </mat-paginator>
</div>
