<div class="">
    <div class="flex-1 overflow-y-auto overflow-x-hidden scroll-thin min-h-0 min-w-0">
        <mat-stepper #stepper class="scrollable-stepper-header bg-transparent" [selectedIndex]="activeStepIndex()"
            (selectedIndexChange)="onStepChange($event)">
            <!-- Completed -->
            <ng-template matStepperIcon="done">
                <svg lucideIcon="check" class="w-3 h-3 text-white-600"></svg>
            </ng-template>

            <!-- Editable -->
            <ng-template matStepperIcon="edit">
                <svg lucideIcon="pencil" class="w-3 h-3 text-white-600"></svg>
            </ng-template>

            <!-- Step 1: Personal Info -->
            <mat-step>
                <ng-template matStepLabel>Personal Info</ng-template>
                @if (activeStepIndex() == 0) {
                <qfin-personal-component [utilities]="utilityComponents()" [memberId]="memberId()"
                    (onSave)="handleSave($event)" (onUpdate)="handlePersonal()" [activeIndex]="activeStepIndex()">
                </qfin-personal-component>
                }
            </mat-step>

            @if (memberId() != emptyGuid) {
            <!-- Step 2: KYC Info -->
            <mat-step>
                <ng-template matStepLabel>KYC Info</ng-template>
                @if (activeStepIndex() == 1) {
                <qfin-kyc-component [memberId]="memberId()" (onKycUpdate)="handleKyc()">
                </qfin-kyc-component>
                }
            </mat-step>

            <!-- Step 3: Address Info -->
            <mat-step>
                <ng-template matStepLabel>Address Info</ng-template>
                @if (activeStepIndex() == 2) {
                <qfin-address-component [memberId]="memberId()" (onAddressUpdate)="handleAddress()">
                </qfin-address-component>
                }
            </mat-step>
            }
        </mat-stepper>
    </div>
</div>
