<form (submit)="onSubmit($event)">
  <div class="flex flex-col gap-6">
    <div class="flex flex-col gap-6">
      <!-- User ID -->
      <mat-form-field class="w-full" appearance="outline" autocomplete="off">
        <mat-label>MFA Code</mat-label>
        <div matPrefix class="w-10 flex justify-center text-primary-700">
          <svg lucideIcon="shield-check" class="w-5 h-5"></svg>
        </div>
        <input matInput [formField]="mfaForm.mfaCode" autocomplete="off" placeholder="Enter MFA Code">
        <!-- @if (
        loginForm.username.touched() &&
        loginForm.username.invalid()
      ) {

        <mat-error>
          User ID is required
        </mat-error>

      } -->
      </mat-form-field>
    </div>

    <div class="flex justify-end items-center text-sm ">
      <a (click)="onMfaRegister()" class="flex gap-2 items-center cursor-pointer">
        <svg lucideShieldCheck class="w-5 h-5 text-primary-700 hover:text-blue-700"></svg>
        <span class="text-blue-600 hover:text-primary-700">Register MFA</span>
      </a>
    </div>

    <!-- <button mat-flat-button color="primary" class="login-button w-full mt-6" [disabled]="mfaForm().invalid()">
      Sign In
    </button> -->
    <button [disabled]="mfaForm().invalid() || isLoading()"
      class="ripple-btn shine-sweep rounded-lg px-5 py-3.5 font-lg
          flex items-center justify-center gap-2 text-sm font-semibold text-white bg-linear-to-r from-primary-500 to-secondary-500 shadow-glow hover:shadow-glow transition cursor-pointer lift disabled:opacity-70 disabled:cursor-not-allowed">
      @if (isLoading()) {
      <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span>Verifying...</span>
      } @else {
      <svg lucideIcon="badge-check" class="w-4 h-4"></svg>
      Verify
      }
    </button>
  </div>
</form>
