<div class="flex flex-col overflow-hidden">
    <div class="flex-1 overflow-y-auto scroll-thin space-y-6 min-h-0 mb-2">
        <div class="space-y-6">
            <div>
                <h3 class="text-base font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2 pb-3">
                    Configuration Details
                </h3>
                <div class="w-10 h-1 rounded-full bg-primary-500 mt-1 mb-5"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
                    <mat-label>Name</mat-label>
                    <div class="w-12 flex justify-center" matPrefix>
                        <svg lucideIcon="user" class="w-5 h-5"></svg>
                    </div>
                    <input matInput [formField]="salaryForm.name" autocomplete="off" placeholder="Enter name">
                </mat-form-field>

                <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
                    <mat-label>Code</mat-label>
                    <div class="w-12 flex justify-center" matPrefix>
                        <svg lucideIcon="code" class="w-5 h-5"></svg>
                    </div>
                    <input matInput [formField]="salaryForm.code" autocomplete="off" placeholder="Enter code">
                </mat-form-field>

                <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
                    <mat-label>Category</mat-label>
                    <div class="w-12 flex justify-center" matPrefix>
                        <svg lucideIcon="tag" class="w-5 h-5"></svg>
                    </div>
                    <mat-select [formField]="salaryForm.categoryId" placeholder="Select category">
                        @for (category of categories(); track category.id) {
                        <mat-option [value]="category.id">
                            {{ category.name }}
                        </mat-option>
                        }
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
                    <mat-label>Display Order</mat-label>
                    <div class="w-12 flex justify-center" matPrefix>
                        <svg lucideIcon="list-ordered" class="w-5 h-5"></svg>
                    </div>
                    <input matInput type="number" [formField]="salaryForm.displayOrder"
                        placeholder="Enter display order">
                </mat-form-field>
            </div>

            <div>
                <h3 class="text-base font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2 pb-3">
                    Applicability Rules
                </h3>
                <div class="w-10 h-1 rounded-full bg-primary-500 mt-1 mb-5"></div>
                <div
                    class="grid grid-cols-2 md:grid-cols-5 gap-2 bg-slate-100/50 dark:bg-white/5 dark:text-white rounded-xl p-4 border border-slate-200/20 dark:border-white/5">
                    <mat-checkbox [formField]="salaryForm.isActive" color="primary">Is Active?</mat-checkbox>
                    <mat-checkbox [formField]="salaryForm.isTaxable" color="primary">Is Taxable?</mat-checkbox>
                    <mat-checkbox [formField]="salaryForm.isPfapplicable" color="primary">PF Applicable?</mat-checkbox>
                    <mat-checkbox [formField]="salaryForm.isEsiapplicable" color="primary">ESI
                        Applicable?</mat-checkbox>
                    <mat-checkbox [formField]="salaryForm.isCtccomponent" color="primary">Part of CTC?</mat-checkbox>
                </div>
            </div>
        </div>
    </div>

    <div class="border-t border-slate-200 dark:border-slate-400/10 py-2 flex justify-end gap-3">
        <button type="button" (click)="onCancelClicked()"
            class="bg-white shadow rounded-lg px-4 py-2.5 flex items-center gap-2 text-sm font-medium hover:shadow-glass transition lift shine-sweep cursor-pointer">
            <svg lucideIcon="x" class="w-4 h-4"></svg>
            Cancel
        </button>
        <button type="button" (click)="onSubmit()"
            class="ripple-btn shadow shine-sweep rounded-lg px-5 py-2.5 flex items-center gap-2 text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-secondary-500 hover:shadow-glow transition lift cursor-pointer">
            <svg lucideIcon="save" class="w-4 h-4"></svg>
            {{ isEditMode() ? 'Update' : 'Submit' }}
        </button>
    </div>
</div>
