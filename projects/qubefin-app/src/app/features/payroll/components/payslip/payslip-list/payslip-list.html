<div class="overflow-auto scroll-thin ">
    <div class="overflow-auto scrollbar-thin flex-1">
        <table mat-table [dataSource]="data()" class="w-full table">
            
            <ng-container matColumnDef="organizationUnitName">
                <th mat-header-cell *matHeaderCellDef> Organization Unit </th>
                <td mat-cell *matCellDef="let element"> {{element.organizationUnitName}} </td>
            </ng-container>

            <ng-container matColumnDef="designation">
                <th mat-header-cell *matHeaderCellDef> Designation </th>
                <td mat-cell *matCellDef="let element"> {{element.designation}} </td>
            </ng-container>
            
            <ng-container matColumnDef="salaryGrade">
                <th mat-header-cell *matHeaderCellDef> Salary Grade </th>
                <td mat-cell *matCellDef="let element"> {{element.salaryGrade}} </td>
            </ng-container>

            <ng-container matColumnDef="payrollMonthYear">
                <th mat-header-cell *matHeaderCellDef> Month Year </th>
                <td mat-cell *matCellDef="let element"> {{element.payrollMonthYear}} </td>
            </ng-container>

            <ng-container matColumnDef="netPay">
                <th mat-header-cell *matHeaderCellDef> Net Pay </th>
                <td mat-cell *matCellDef="let element"> {{element.netPay}} </td>
            </ng-container>

            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef class="text-right!"> Action </th>
                <td mat-cell *matCellDef="let element">
                    <div class="w-full flex justify-end">
                        <div class="flex items-center justify-center rounded-full cursor-pointer w-9 h-9 hover:bg-primary-400/10"
                            [matTooltip]="openingPayslipId() === element.payslipId ? 'Opening payslip...' : 'View payslip'"
                            (click)="onViewDocument(element)">
                            @if (openingPayslipId() === element.payslipId) {
                            <svg lucideIcon="loader" class="w-5 h-5 text-primary-500 animate-spin"></svg>
                            } @else {
                            <svg lucideIcon="file-text" class="w-5 h-5 text-primary-500 dark:text-primary-500 hover:text-primary-600"></svg>
                            }
                        </div>
                    </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="transition-colors"></tr>
        <tr class="mat-row" *matNoDataRow colspan="6">
            <td class="mat-cell text-center! p-8 italic text-gray-500 border-b-0"
                [attr.colspan]="displayedColumns.length">
                <div class="flex justify-center items-center gap-2">
                    <svg lucideIcon="triangle-alert" class="w-5 h-5 text-slate-400"></svg>
                    No payslip data found.
                </div>
            </td>
        </tr>
        </table>
    </div>
</div>
