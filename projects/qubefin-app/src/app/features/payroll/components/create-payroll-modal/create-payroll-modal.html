<div class="p-6">
  <div class="flex items-center justify-between mb-5">
    <h2 class="flex items-center gap-2 text-xl font-bold text-slate-800 dark:text-slate-100">
      <svg lucideIcon="calendar-plus" class="w-5 h-5 text-primary-500"></svg>
      Create Payroll
    </h2>
    <button mat-dialog-close class="transition cursor-pointer text-slate-400 hover:text-red-500">
      <svg lucideIcon="x" class="w-5 h-5"></svg>
    </button>
  </div>

  <div class="mb-6">
    <label class="block mb-2 text-sm font-medium text-slate-700 dark:text-slate-300">Select Company</label>
    <div class="relative">
      <select 
        (change)="onCompanyChange($event)"
        class="w-full px-4 py-2.5 text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 appearance-none"
        [disabled]="companyStore.loading()">
        
        <option value="" disabled selected>-- Choose a company --</option>
        
        @for (company of companyStore.companies(); track company.id) {
            <option [value]="company.id">{{ company.name }}</option>
        }
      </select>
      
      <div class="absolute text-slate-400 right-3 top-3 pointer-events-none">
         <svg lucideIcon="chevron-down" class="w-4 h-4"></svg>
      </div>
    </div>
    
    @if (companyStore.loading()) {
        <p class="mt-2 text-xs text-slate-400 animate-pulse">Loading companies...</p>
    }
  </div>

  <div class="flex items-center justify-end gap-3 mt-6">
    <button mat-dialog-close class="px-4 py-2 text-sm font-medium transition cursor-pointer text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg">
      Cancel
    </button>
    <button 
      (click)="onGenerate()" 
      [disabled]="payrollStore.isCreatingPayroll() || !selectedCompanyId()"
      class="flex items-center gap-2 px-5 py-2 text-sm font-semibold text-white transition rounded-lg cursor-pointer bg-linear-to-r from-primary-500 to-secondary-500 shadow-md hover:shadow-glow disabled:opacity-50 disabled:cursor-not-allowed">
      
      @if (payrollStore.isCreatingPayroll()) {
         <svg class="w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
         </svg>
         Generating...
      } @else {
         Generate
      }
    </button>
  </div>
</div>
