    <mat-form-field appearance="outline" class="w-full">
        <mat-label>Select Company</mat-label>

        <mat-select
            [(value)]="selectedCompanyId"
            [disabled]="companyStore.loading()"
            (selectionChange)="onCompanyChange($event.value)">

            @for (company of companyStore.companies(); track company.id) {
                <mat-option [value]="company.id">
                    {{ company.name }}
                </mat-option>
            }
        </mat-select>

        <div class="w-12 flex justify-center" matPrefix>
          <svg lucideIcon="building-2" class="w-5 h-5"></svg>
        </div>
    </mat-form-field>

    @if (companyStore.loading()) {
    <p class="mt-2 text-xs text-slate-400 animate-pulse">Loading companies...</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions class="flex items-center justify-end gap-3 mt-6">
    <button mat-dialog-close
      class="px-4 py-2 flex justify-center items-center gap-1 text-sm font-medium transition cursor-pointer text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg">
      <svg lucideIcon="x" class="w-5 h-5"></svg>
      Cancel
    </button>
    <button (click)="onGenerate()" [disabled]="payrollStore.isCreatingPayroll() || !selectedCompanyId()"
      class="flex items-center gap-2 px-5 py-2 text-sm font-semibold text-white transition rounded-lg cursor-pointer bg-linear-to-r from-primary-500 to-secondary-500 shadow-md hover:shadow-glow disabled:opacity-50 disabled:cursor-not-allowed">

      @if (payrollStore.isCreatingPayroll()) {
      <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
        </path>
      </svg>
      Generating...
      } @else {
        <svg lucideIcon="save" class="w-5 h-5"></svg>
      Generate
      }
    </button>
  </mat-dialog-actions>
