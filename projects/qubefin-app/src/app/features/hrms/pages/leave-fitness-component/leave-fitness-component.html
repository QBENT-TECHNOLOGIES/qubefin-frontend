<div class="page-container">
  <div class="flex items-start" [ngClass]="isViewMode() ? 'gap-4' : 'gap-4'">
    <div class="mainCard-area glass" [ngClass]="{
          'w-full max-w-full opacity-100 translate-x-0':
              selectedId() === EMPTY_UUID && isViewMode(),

          'w-1/4 max-w-[25%] opacity-100 translate-x-0 sticky top-0 h-[calc(100vh-170px)]':
              !isViewMode() && selectedId() !== EMPTY_UUID,

          'w-0 max-w-0 h-0 opacity-0 -translate-x-4 pointer-events-none':
              false
      }">

      @if (loading()) {
      <div class="px-4 py-10 text-sm text-slate-500 text-center flex justify-center gap-2">
        <svg lucideIcon="loader" class="w-5 h-5 animate-spin"></svg>
        Loading...
      </div>
      } @else {
      <qfin-leave-fitness-list [data]="listData()" [selectedId]="selectedId()"
        [isCollapsed]="selectedId() !== EMPTY_UUID && !isViewMode()" (onViewDetail)="onView($event)">
      </qfin-leave-fitness-list>
      }
    </div>

    @if (hasSelectedRecord()) {
    <div class="viewArea-container glass flex flex-col h-[calc(100vh-170px)] overflow-hidden" [ngClass]="{
        'w-3/4': !isViewMode() && selectedId() !== EMPTY_UUID,
        'w-full': false
      }">
      <div class="viewArea-header">
        <div class="viewArea-headerInner">
          <div class="flex items-center gap-4">
            <div>
              <div class="flex justify-start gap-2">
                <h2 class="viewArea-title">Leave Request Fitness Report Approval</h2>
                <div class="viewArea-badge">
                  <span class="w-1.5 h-1.5 rounded-full bg-blue-500 dark:bg-blue-400"></span>
                  <span class="text-[10px] font-semibold text-blue-600 dark:text-blue-400 uppercase tracking-wider">
                    Action Mode
                  </span>
                </div>
              </div>
              <p class="viewArea-description">Review leave information and approve or reject the fitness report.</p>
            </div>
          </div>
        </div>
        
        <button aria-label="Close" matTooltip="Close"
          class="pannel-close"
          (click)="closePanel()">
          <svg lucideIcon="x" class="w-4 h-4"></svg>
        </button>
      </div>     

      <div class="flex-1 min-h-0 overflow-hidden overflow-y-auto scroll-thin p-4">
        <qfin-leave-fitness-detail [recordId]="selectedId()" (cancel)="closePanel()"
          (actionCompleted)="onActionCompleted()">
        </qfin-leave-fitness-detail>
      </div>
    </div>
    }
  </div>
</div>
