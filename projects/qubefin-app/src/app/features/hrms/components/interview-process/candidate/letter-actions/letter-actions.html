<div class="relative inline-flex">

  <!-- PRIMARY: send. The action wanted almost every time. -->
  <button type="button" [disabled]="busy()" (click)="onSend()"
    class="flex items-center gap-2 px-5 py-2.5 rounded-l-lg text-sm font-semibold text-white
           bg-linear-to-r from-primary-500 to-secondary-500 shadow-glow transition cursor-pointer
           disabled:opacity-60 disabled:cursor-not-allowed">
    <svg lucideIcon="send" class="w-4 h-4"></svg>
    {{ sendLabel() }}
  </button>

  <!-- CARET: view & print + mark received -->
  <button type="button" [disabled]="busy()" (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()" aria-haspopup="menu"
    [attr.aria-label]="'More ' + letterName() + ' letter actions'"
    class="flex items-center px-2.5 rounded-r-lg text-white border-l border-white/30
           bg-linear-to-r from-secondary-500 to-secondary-500 shadow-glow transition cursor-pointer
           disabled:opacity-60 disabled:cursor-not-allowed">
    <svg [lucideIcon]="menuOpen() ? 'chevron-up' : 'chevron-down'" class="w-4 h-4"></svg>
  </button>

  @if (menuOpen()) {
  <div role="menu"
    class="absolute top-full left-0 mt-1.5 min-w-56 z-20 p-1.5 rounded-xl bg-white dark:bg-slate-800
           border border-slate-200 dark:border-slate-700 shadow-lg">

    <button type="button" role="menuitem" (click)="onView()"
      class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-left
             text-slate-600 dark:text-slate-200 hover:bg-green-50 dark:hover:bg-green-900/20
             hover:text-green-700 dark:hover:text-green-400 transition cursor-pointer">
      <svg lucideIcon="printer" class="w-4 h-4"></svg>
      View &amp; Print
    </button>

    <button type="button" role="menuitem" [disabled]="receiving()" (click)="onReceive()"
      class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-left
             text-slate-600 dark:text-slate-200 hover:bg-green-50 dark:hover:bg-green-900/20
             hover:text-green-700 dark:hover:text-green-400 transition cursor-pointer
             disabled:opacity-60 disabled:cursor-not-allowed">
      <svg lucideIcon="mail-check" class="w-4 h-4"></svg>
      {{ receiveLabel() }}
    </button>
  </div>
  }
</div>
