<div
    class="flex items-center justify-between px-5 py-3 bg-white/60 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
    <div class="flex items-center gap-4">
        <div
            class="flex items-center justify-center w-12 h-12 rounded-full bg-indigo-50 dark:bg-secondary-600/50 text-indigo-600 dark:text-indigo-500 border border-indigo-100 dark:border-0">
            <svg lucideIcon="calendar-clock" class="w-6 h-6"></svg>
        </div>
        <div>
            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 leading-tight">
                {{ isReschedule ? 'Update Interview Schedule' : 'Schedule Interview' }}
            </h2>
            <p class="text-sm text-slate-500 font-medium mt-1">{{ data.candidateName }}</p>
        </div>
    </div>
    <button (click)="onCancel()"
        class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-full transition-colors cursor-pointer focus:outline-none">
        <svg lucideIcon="x" class="w-5 h-5"></svg>
    </button>
</div>

<mat-dialog-content class="p-5!">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
            <mat-label>Interview Date</mat-label>
            <div class="w-12 flex justify-center" matPrefix>
                <svg lucideIcon="calendar-1" class="w-5 h-5"></svg>
            </div>
            <input matInput [matDatepicker]="interviewDatePicker" [min]="today" autocomplete="off"
                (keydown)="$event.preventDefault()" [ngModel]="interviewDate()"
                (ngModelChange)="interviewDate.set($event)">
            <mat-datepicker-toggle matIconSuffix [for]="interviewDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #interviewDatePicker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
            <mat-label>Interview Time</mat-label>
            <div class="w-10 flex justify-center text-slate-400" matPrefix>
                <svg lucideIcon="clock-3" class="w-[16px] h-[16px]"></svg>
            </div>
            <input matInput type="text" [value]="interviewTime()" readonly placeholder="Select time"
                (click)="openTimePicker()" class="cursor-pointer" />
            <button type="button" matSuffix (click)="openTimePicker()"
                class="text-primary-600 p-2 cursor-pointer">
                <svg lucideIcon="clock-3" class="w-[16px] h-[16px]"></svg>
            </button>
        </mat-form-field>
    </div>

    @if (submitted() && (!interviewDate() || !interviewTime())) {
    <p class="mt-3 text-xs font-medium text-rose-600">Interview date and time are both required.</p>
    }
</mat-dialog-content>

<mat-dialog-actions class="justify-end! px-6 py-4 bg-white/60 dark:bg-slate-800 border-t border-slate-200 gap-3">
    <button (click)="onCancel()"
        class="cursor-pointer px-5 py-2.5 flex items-center gap-2 bg-white border border-slate-300 hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 text-slate-700 text-sm font-semibold rounded-lg shadow-sm transition-all">
        <svg lucideIcon="x" class="w-4 h-4"></svg>
        Cancel
    </button>
    <button (click)="onSave()" [disabled]="saving()"
        class="ripple-btn shine-sweep rounded-lg px-5 py-2.5 flex items-center gap-2 text-sm font-semibold text-white bg-linear-to-r from-primary-500 to-secondary-500 shadow-glow transition cursor-pointer lift disabled:opacity-50 disabled:cursor-not-allowed">
        <svg lucideIcon="check" class="w-4 h-4"></svg>
        {{ saving() ? 'Saving...' : (isReschedule ? 'Update' : 'Schedule') }}
    </button>
</mat-dialog-actions>
