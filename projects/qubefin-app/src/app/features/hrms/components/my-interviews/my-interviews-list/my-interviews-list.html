<div class="overflow-x-auto p-4 bg-white dark:bg-slate-800 rounded-lg shadow-sm border border-slate-200 dark:border-slate-700">
    <table mat-table [dataSource]="data()" class="w-full bg-transparent">
        
        <!-- Candidate Column -->
        <ng-container matColumnDef="candidate">
            <th mat-header-cell *matHeaderCellDef class="text-slate-500 font-medium text-xs uppercase tracking-wider"> Candidate </th>
            <td mat-cell *matCellDef="let element" class="py-3 font-medium text-slate-800 dark:text-slate-200 text-sm">
                {{ element.candidateId }} <!-- In real app, map ID to name -->
            </td>
        </ng-container>

        <!-- Scheduled Date Column -->
        <ng-container matColumnDef="scheduledDate">
            <th mat-header-cell *matHeaderCellDef class="text-slate-500 font-medium text-xs uppercase tracking-wider"> Date </th>
            <td mat-cell *matCellDef="let element" class="py-3 text-slate-600 dark:text-slate-400 text-sm">
                {{ element.scheduledDate }}
            </td>
        </ng-container>

        <!-- Scheduled Time Column -->
        <ng-container matColumnDef="scheduledTime">
            <th mat-header-cell *matHeaderCellDef class="text-slate-500 font-medium text-xs uppercase tracking-wider"> Time </th>
            <td mat-cell *matCellDef="let element" class="py-3 text-slate-600 dark:text-slate-400 text-sm">
                {{ element.scheduledTime }}
            </td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef class="text-slate-500 font-medium text-xs uppercase tracking-wider"> Status </th>
            <td mat-cell *matCellDef="let element" class="py-3 text-sm">
                @if(element.isAcknowledged) {
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400">
                        Acknowledged
                    </span>
                } @else {
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-orange-100 text-orange-800 dark:bg-orange-900/30 dark:text-orange-400">
                        Pending Acknowledgement
                    </span>
                }
            </td>
        </ng-container>

        <!-- Action Column -->
        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="text-slate-500 font-medium text-xs uppercase tracking-wider text-right"> </th>
            <td mat-cell *matCellDef="let element" class="py-3 text-right">
                @if(!element.isAcknowledged) {
                    <button type="button" class="text-primary-600 hover:text-primary-800 text-sm font-medium mr-3" (click)="onAcknowledge(element.id)">
                        Acknowledge
                    </button>
                }
                <button type="button" class="text-primary-600 hover:text-primary-800 text-sm font-medium" (click)="onView(element.id)">
                    View/Assess
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="border-b border-slate-200 dark:border-slate-400/10"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" 
            class="border-b border-slate-100 dark:border-slate-400/5 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
        </tr>
    </table>

    @if(data().length === 0) {
        <div class="text-sm text-slate-500 text-center py-8 bg-slate-50 dark:bg-slate-900/30 rounded-lg border border-slate-200 dark:border-slate-700 mt-4">
            No interviews found.
        </div>
    }
</div>
