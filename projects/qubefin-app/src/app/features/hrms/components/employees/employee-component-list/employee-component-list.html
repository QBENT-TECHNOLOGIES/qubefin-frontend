<div class="overflow-auto scroll-thin" [ngClass]="{
        'h-[calc(100vh-170px-72px)] overflow-y-auto': isCollapsed()
    }">

    <table mat-table [dataSource]="data() || []" matSort matSortActive="fullName" matSortDirection="asc"
        (matSortChange)="onSortChange($event)" class="w-full table">
        <ng-container matColumnDef="sl">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let row; let i = index"
                class="px-3 py-1.5 text-[13px] font-medium dark:text-slate-300">
                {{ pageIndex() * pageSize() + i + 1 }}
            </td>
        </ng-container>
        <ng-container matColumnDef="nameCode">
            <th mat-header-cell *matHeaderCellDef> Name, Code </th>
            <td mat-cell *matCellDef="let item">
                <span class="text-[13px] font-medium dark:text-slate-300">{{ item.fullName }}</span><br />
                <span class="text-xs text-primary-700 dark:text-primary-600">{{ item.code }}</span>
            </td>
        </ng-container>
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="name"> Name </th>
            <td mat-cell *matCellDef="let item" class="px-3 py-1.5 text-[13px] font-medium dark:text-slate-300">
                {{ item.fullName }}
            </td>
        </ng-container>
        <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="code"> Code </th>
            <td mat-cell *matCellDef="let item"> {{ item.code }} </td>
        </ng-container>
        <ng-container matColumnDef="joiningDate">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="joiningDate"> Joining Date </th>
            <td mat-cell *matCellDef="let item"> {{ (item.joiningDate | date: "dd/MM/yyyy") ?? "" }} </td>
        </ng-container>
        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="!text-right"> Action </th>
            <td mat-cell *matCellDef="let item" class="p-3 text-sm text-right">
                <div class="w-full flex justify-end">
                    <div class="flex items-center justify-center rounded-full cursor-pointer w-9 h-9 hover:bg-primary-400/10"
                        matTooltip="View" (click)="onDetailView(item.id)">
                        <svg lucideIcon="chevron-right"
                            class="w-5 h-5 text-primary-500 dark:text-primary-500 hover:text-primary-600"></svg>
                    </div>
                </div>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns();" [class.bg-primary-500]="selectedId() === row.id"
            [class.bg-opacity-10]="selectedId() === row.id" class="transition-colors">
        </tr>
        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell text-center! p-8 italic text-gray-500 border-b-0"
                [attr.colspan]="displayedColumns().length">
                <div class="flex justify-center items-center gap-2">
                    <svg lucideIcon="triangle-alert" class="w-5 h-5 text-slate-400"></svg>
                    No Employees data found.
                </div>
            </td>
        </tr>
    </table>
    @if (!isCollapsed()) {
    <mat-paginator [length]="totalRecords()" [pageSize]="pageSize()" [pageIndex]="pageIndex()"
        [pageSizeOptions]="[10, 20, 50]" (page)="onPage($event)">
    </mat-paginator>
    }
</div>
