<div
    class="flex items-center justify-between px-5 py-3 bg-white/60 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
    <div class="flex items-center gap-4">
        <div
            class="flex items-center justify-center w-12 h-12 rounded-full bg-indigo-50 dark:bg-secondary-600/50 text-indigo-600 dark:text-indigo-500 border border-indigo-100 dark:border-0">
            <svg lucideIcon="user-round-plus" class="w-6 h-6"></svg>
        </div>
        <div>
            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 leading-tight">
                Employee Joining Information
            </h2>
        </div>
    </div>
    <button (click)="onCancel()"
        class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-full transition-colors cursor-pointer focus:outline-none">
        <svg lucideIcon="x" class="w-5 h-5"></svg>
    </button>
</div>
<div class="box glass p-4 pb-6 m-2 mt-0">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 my-3">

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
            <mat-label>Monthly Cost To Company</mat-label>
            <div class="w-12 flex justify-center" matPrefix>
                <svg lucideIcon="badge-indian-rupee" class="w-5 h-5"></svg>
            </div>
            <input matInput type="number" autocomplete="off" [formField]="joiningInfoForm.monthlyCtc"
                (wheel)="$event.preventDefault()" placeholder="Gross Salary">
            <mat-error class="cus-error">
                {{ joiningInfoForm.monthlyCtc().errors()[0]?.message }}
            </mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
            <mat-label>Offer Letter Date</mat-label>
            <div class="field-icon" matPrefix>
                <svg lucideIcon="calendar-clock" class="w-5 h-5"></svg>
            </div>
            <input matInput [matDatepicker]="picker" [formField]="joiningInfoForm.offerLetterDate"
                (keydown)="$event.preventDefault()" placeholder="Select Date" />
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
            <mat-error class="cus-error">
                {{ joiningInfoForm.offerLetterDate().errors()[0]?.message }}
            </mat-error>
        </mat-form-field>
    </div>
    <div class="flex items-center justify-between pt-4 bg-white/60 dark:bg-slate-800 border-t border-slate-200">


        <!-- Bottom-Right Corner: Save & Cancel Buttons -->
        <div class="flex items-center gap-3">
            <button (click)="onAdd()" class="global-btn shine-sweep lift">
                <!-- <svg lucideIcon="loader-2" class="w-4 h-4 animate-spin"></svg> Saving... -->
                <svg lucideIcon="save" class="w-4 h-4"></svg> Save
            </button>

            <button (click)="onCancel()"
                class="cursor-pointer px-5 py-2.5 flex items-center gap-2 bg-white border border-slate-300 hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 text-slate-700 text-sm font-semibold rounded-lg shadow-sm transition-all disabled:opacity-60 disabled:cursor-not-allowed">
                <svg lucideIcon="x" class="w-4 h-4"></svg>
                Cancel
            </button>
        </div>
    </div>
