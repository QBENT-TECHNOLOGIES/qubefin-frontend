<div
    class="flex items-center justify-between px-5 py-3 bg-white/60 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
    <div class="flex items-center gap-4">
        <div
            class="flex items-center justify-center w-12 h-12 rounded-full bg-indigo-50 dark:bg-secondary-600/50 text-indigo-600 dark:text-indigo-500 border border-indigo-100 dark:border-0">
            <svg lucideIcon="folder" class="w-6 h-6"></svg>
        </div>
        <div>
            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 leading-tight">
                Employee Document List
            </h2>
        </div>
    </div>
    <button (click)="onCancel()"
        class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-full transition-colors cursor-pointer focus:outline-none">
        <svg lucideIcon="x" class="w-5 h-5"></svg>
    </button>
</div>
<div class="box glass p-4 pb-6 m-2">
    <div class="flex flex-col gap-3">
        <div class="flex justify-between">
            <div>
                <h4 class="box-content-heading">
                    Employee Documents
                </h4>
                <div class="blue-line mb-2!"></div>
            </div>
        </div>

        <div class="table-box" style="max-height: 275px;">
            <table mat-table [dataSource]="documents()" matSortDisableClear class="w-full table">
                <ng-container matColumnDef="sl">
                    <th mat-header-cell *matHeaderCellDef>Sl.</th>
                    <td mat-cell *matCellDef="let row; let i = index"
                        class="px-3 py-1.5 text-[13px] font-medium dark:text-slate-300">
                        {{ i + 1 }}
                    </td>
                </ng-container>
                <ng-container matColumnDef="docName">
                    <th mat-header-cell *matHeaderCellDef>Document Name</th>
                    <td mat-cell *matCellDef="let item">
                        {{ item.documentName }}
                    </td>
                </ng-container>
                <ng-container matColumnDef="fileName">
                    <th mat-header-cell *matHeaderCellDef>File Name</th>
                    <td mat-cell *matCellDef="let item">
                        {{ item.fileName }}
                    </td>
                </ng-container>
                <ng-container matColumnDef="view">
                    <th mat-header-cell *matHeaderCellDef class="text-center">View</th>
                    <td mat-cell *matCellDef="let item" class="text-center">
                        @if (item.fileUrl!=null && item.fileName!=null) {
                        <!-- View Button -->
                        <button type="button" (click)="onOpenDocument(item)"
                            class="bg-primary-50 hover:bg-primary-100 dark:bg-primary-900/20 dark:hover:bg-primary-900/40 text-primary-600 dark:text-primary-400 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition-colors border border-primary-200 dark:border-primary-800/30 cursor-pointer mx-auto">
                            <svg lucideIcon="eye" class="w-3.5 h-3.5"></svg>
                            View
                        </button>
                        } @else {
                        <!-- Pending Badge -->
                        <span
                            class="whitespace-nowrap text-[13px] px-1.5 py-0.5 rounded bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-500">
                            Upload Pending
                        </span>
                        }
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns(); sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>

                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell text-center! p-8 italic text-gray-500 border-b-0"
                        [attr.colspan]="displayedColumns().length">
                        <div class="flex justify-center items-center gap-2">
                            <svg lucideIcon="triangle-alert" class="w-5 h-5 text-slate-400"></svg>
                            No Documents found.
                        </div>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
