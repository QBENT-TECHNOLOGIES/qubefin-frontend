<div class="space-y-4 animate-fade-in">
    <div>
        <h3 class="text-base font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2 pb-1">
            Bank Details Info
        </h3>
        <div class="w-10 h-1 rounded-full bg-primary-500 mt-1"></div>
    </div>

        <!-- -----------Bank Holder Name--------- -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
            <mat-label>Bank Holder Name</mat-label>
            <div class="w-12 flex justify-center" matPrefix>
                <svg lucideIcon="mail" class="w-5 h-5">person</svg>
            </div>
            <input matInput type="email" autocomplete="off" [formField]="bankingForm.bankHolderName"
                placeholder="Enter Bank Holder Name">
        </mat-form-field>
        
        <!-- -----------Branch Name--------- -->
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
            <mat-label>Branch Name</mat-label>
            <div class="w-12 flex justify-center" matPrefix>
                <svg lucideIcon="mail" class="w-5 h-5">location_on</svg>
            </div>
            <input matInput type="email" autocomplete="off" [formField]="bankingForm.bankBranch"
                placeholder="Enter Branch Name">
        </mat-form-field>

        <!-- -----------Account Number--------- -->
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
            <mat-label>Account Number</mat-label>
            <div class="w-12 flex justify-center" matPrefix>
                <svg lucideIcon="mail" class="w-5 h-5">credit_card</svg>
            </div>
            <input matInput type="number" autocomplete="off" [formField]="bankingForm.bankAccountNo"
                placeholder="Enter Account Number">
        </mat-form-field>

        <!-- -----------ESI IP NUMBER--------- -->
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
            <mat-label>ESI IP NUMBER</mat-label>
            <div class="w-12 flex justify-center" matPrefix>
                <svg lucideIcon="mail" class="w-5 h-5">key</svg>
            </div>
            <input matInput type="email" autocomplete="off" [formField]="bankingForm.esiIpNumber"
                placeholder="Enter ESI IP NUMBER">
        </mat-form-field>

        <!-- -----------Universal Account Number (UAN)--------- -->
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
            <mat-label>Universal Account Number (UAN)</mat-label>
            <div class="w-12 flex justify-center" matPrefix>
                <svg lucideIcon="mail" class="w-5 h-5">badge</svg>
            </div>
            <input matInput type="email" autocomplete="off" [formField]="bankingForm.universalAccountNumber"
                placeholder="Enter UAN No">
        </mat-form-field>
    </div>

    <div
        class="mt-2 border-t border-slate-200/20 dark:border-white/10 px-3 py-4 bg-slate-400/5 flex justify-between gap-3">
        <div class="flex flex-1 justify-end items-center gap-3">
            <button type="button" (click)="onSubmit()"
                class="ripple-btn shadow shine-sweep rounded-lg px-5 py-2.5 flex items-center gap-2 text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-secondary-500 hover:shadow-glow transition lift cursor-pointer">
                Save
                <svg lucideIcon="chevron-right" class="w-5 h-5"></svg>
            </button>
        </div>
    </div>
</div>
