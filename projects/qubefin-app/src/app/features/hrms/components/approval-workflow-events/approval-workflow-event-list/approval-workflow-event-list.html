<div class="overflow-auto scroll-thin">
    <table mat-table [dataSource]="data()" class="w-full table">
        <ng-container matColumnDef="eventName">
            <th mat-header-cell *matHeaderCellDef> Event name </th>
            <td mat-cell *matCellDef="let item" class="px-3 py-1.5 text-[13px] font-medium dark:text-slate-300">
                {{ item.description }}
            </td>
        </ng-container>

        <ng-container matColumnDef="eventCode">
            <th mat-header-cell *matHeaderCellDef> Event code </th>
            <td mat-cell *matCellDef="let item">{{ item.eventCode || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="approvalLevels">
            <th mat-header-cell *matHeaderCellDef> Approval levels </th>
            <td mat-cell *matCellDef="let item">
                <span class="inline-flex items-center gap-1.5 text-sm text-slate-600 dark:text-slate-300">
                    <svg lucideIcon="list-ordered" class="w-4 h-4 text-primary-500"></svg>
                    {{ item.approvalLevels }}
                </span>
            </td>
        </ng-container>

        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Status </th>
            <td mat-cell *matCellDef="let item">
                <span class="px-2 py-1 text-xs rounded font-medium" [class.bg-green-100]="item.isActive"
                    [class.text-green-800]="item.isActive" [class.bg-red-100]="!item.isActive"
                    [class.text-red-800]="!item.isActive">
                    {{ item.isActive ? 'Active' : 'Inactive' }}
                </span>
            </td>
        </ng-container>

        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="text-right!">Action</th>
            <td mat-cell *matCellDef="let item">
                <div class="w-full flex justify-end">
                    <button type="button" (click)="viewDetail(item.id)" matTooltip="View workflow"
                        class="flex items-center justify-center rounded-full cursor-pointer w-9 h-9 hover:bg-primary-400/10">
                        <svg lucideIcon="chevron-right" class="w-5 h-5 text-primary-500 hover:text-primary-600"></svg>
                    </button>
                </div>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns();" [class.bg-primary-500]="selectedId() === row.id"
            [class.bg-opacity-10]="selectedId() === row.id" class="transition-colors"></tr>
        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell text-center! p-8 italic text-gray-500 border-b-0"
                [attr.colspan]="displayedColumns().length">
                <div class="flex justify-center items-center gap-2">
                    <svg lucideIcon="triangle-alert" class="w-5 h-5 text-slate-400"></svg>
                    No approval workflow events found.
                </div>
            </td>
        </tr>
    </table>
</div>
