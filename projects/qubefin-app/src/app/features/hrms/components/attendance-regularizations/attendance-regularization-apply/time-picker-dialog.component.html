<div class="w-full max-w-[340px] rounded-3xl overflow-hidden bg-white dark:bg-slate-900 shadow-2xl border border-slate-100 dark:border-slate-800/80 transition-all">
  <!-- Header -->
  <div class="flex items-center justify-between px-6 pt-5 pb-4 bg-slate-50/80 dark:bg-slate-800/50 backdrop-blur-sm border-b border-slate-100 dark:border-slate-800">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-primary-50 dark:bg-primary-950/60 flex items-center justify-center text-primary-600 dark:text-primary-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>
      <h2 class="text-base font-bold text-slate-800 dark:text-slate-100 tracking-tight">
        {{ data.title || 'Select Time' }}
      </h2>
    </div>

    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="setNow()"
        class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-semibold text-primary-600 hover:text-primary-700 bg-primary-50 hover:bg-primary-100 dark:bg-primary-950/60 dark:text-primary-600 dark:hover:bg-primary-900/60 transition-all duration-200 shadow-xs active:scale-95 cursor-pointer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        Now
      </button>
      <button
        type="button"
        (click)="dialogRef.close()"
        class="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer"
        aria-label="Close"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Hero Digital Display Readout -->
  <div class="px-5 pt-4">
    <div class="relative bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 text-white py-5 px-4 rounded-2xl shadow-lg border border-slate-700/40 overflow-hidden flex flex-col items-center justify-center">
      <!-- Background Ambient Glow -->
      <div class="absolute -top-10 -right-10 w-28 h-28 bg-primary-500/20 rounded-full blur-2xl pointer-events-none"></div>
      <div class="absolute -bottom-10 -left-10 w-28 h-28 bg-primary-600/15 rounded-full blur-2xl pointer-events-none"></div>

      <!-- Time Numbers -->
      <div class="relative z-10 flex items-center justify-center gap-1.5 font-mono">
        <span class="text-4xl font-extrabold tracking-tight tabular-nums bg-white/10 dark:bg-white/5 backdrop-blur-md px-3 py-1 rounded-xl border border-white/15 text-white shadow-inner">
          {{ pad(selectedHour) }}
        </span>
        <span class="text-3xl font-bold text-primary-400 animate-pulse px-0.5">:</span>
        <span class="text-4xl font-extrabold tracking-tight tabular-nums bg-white/10 dark:bg-white/5 backdrop-blur-md px-3 py-1 rounded-xl border border-white/15 text-white shadow-inner">
          {{ pad(selectedMinute) }}
        </span>
        <span class="ml-2 px-2.5 py-1 text-xs font-black tracking-widest uppercase rounded-lg bg-gradient-to-r from-primary-500 to-primary-600 text-white shadow-md shadow-primary-500/30 border border-primary-400/40">
          {{ selectedPeriod }}
        </span>
      </div>
    </div>
  </div>

  <!-- Wheel Columns -->
  <div class="flex gap-2.5 px-5 pt-4 pb-2">
    <!-- Hours Column -->
    <div class="flex-1">
      <div class="text-center text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5">
        Hour
      </div>
      <div class="relative h-44 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 overflow-hidden shadow-inner">
        <div class="wheel-fade-top"></div>
        <div class="wheel-fade-bottom"></div>
        <div
          #hourList
          class="no-scrollbar h-full overflow-y-auto snap-y snap-mandatory scroll-py-1 py-16"
        >
          @for (hour of hours; track hour) {
            <button
              type="button"
              (click)="selectHour(hour)"
              class="w-full snap-center flex items-center justify-center py-2 text-sm font-semibold transition-all duration-150 cursor-pointer"
              [class.text-primary-600]="selectedHour === hour"
              [class.dark:text-primary-400]="selectedHour === hour"
              [class.font-extrabold]="selectedHour === hour"
              [class.scale-110]="selectedHour === hour"
              [class.text-slate-400]="selectedHour !== hour"
              [class.dark:text-slate-500]="selectedHour !== hour"
              [class.hover:text-slate-700]="selectedHour !== hour"
              [class.dark:hover:text-slate-300]="selectedHour !== hour"
            >
              {{ pad(hour) }}
            </button>
          }
        </div>
        <!-- Center selection guide -->
        <div
          class="pointer-events-none absolute inset-x-1.5 top-1/2 -translate-y-1/2 h-9 rounded-xl bg-primary-500/10 dark:bg-primary-400/15 border border-primary-500/25 dark:border-primary-400/30 shadow-xs"
        ></div>
      </div>
    </div>

    <!-- Minutes Column -->
    <div class="flex-1">
      <div class="text-center text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5">
        Minute
      </div>
      <div class="relative h-44 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 overflow-hidden shadow-inner">
        <div class="wheel-fade-top"></div>
        <div class="wheel-fade-bottom"></div>
        <div
          #minuteList
          class="no-scrollbar h-full overflow-y-auto snap-y snap-mandatory scroll-py-1 py-16"
        >
          @for (minute of minutes; track minute) {
            <button
              type="button"
              (click)="selectMinute(minute)"
              class="w-full snap-center flex items-center justify-center py-2 text-sm font-semibold transition-all duration-150 cursor-pointer"
              [class.text-primary-600]="selectedMinute === minute"
              [class.dark:text-primary-400]="selectedMinute === minute"
              [class.font-extrabold]="selectedMinute === minute"
              [class.scale-110]="selectedMinute === minute"
              [class.text-slate-400]="selectedMinute !== minute"
              [class.dark:text-slate-500]="selectedMinute !== minute"
              [class.hover:text-slate-700]="selectedMinute !== minute"
              [class.dark:hover:text-slate-300]="selectedMinute !== minute"
            >
              {{ pad(minute) }}
            </button>
          }
        </div>
        <!-- Center selection guide -->
        <div
          class="pointer-events-none absolute inset-x-1.5 top-1/2 -translate-y-1/2 h-9 rounded-xl bg-primary-500/10 dark:bg-primary-400/15 border border-primary-500/25 dark:border-primary-400/30 shadow-xs"
        ></div>
      </div>
    </div>

    <!-- AM / PM Period Column -->
    <div class="w-16">
      <div class="text-center text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5">
        Period
      </div>
      <div class="h-44 rounded-2xl border border-slate-200 dark:border-slate-800 flex flex-col justify-center gap-2 p-1.5 bg-slate-50/50 dark:bg-slate-900/50 shadow-inner">
        @for (period of periods; track period) {
          <button
            type="button"
            (click)="selectPeriod(period)"
            class="w-full rounded-xl py-3 text-xs font-bold transition-all duration-200 cursor-pointer"
            [class.bg-gradient-to-r]="selectedPeriod === period"
            [class.from-primary-600]="selectedPeriod === period"
            [class.to-primary-700]="selectedPeriod === period"
            [class.text-white]="selectedPeriod === period"
            [class.shadow-md]="selectedPeriod === period"
            [class.shadow-primary-600/30]="selectedPeriod === period"
            [class.scale-105]="selectedPeriod === period"
            [class.text-slate-400]="selectedPeriod !== period"
            [class.dark:text-slate-500]="selectedPeriod !== period"
            [class.hover:bg-slate-200/60]="selectedPeriod !== period"
            [class.dark:hover:bg-slate-800/60]="selectedPeriod !== period"
            [class.hover:text-slate-700]="selectedPeriod !== period"
            [class.dark:hover:text-slate-300]="selectedPeriod !== period"
          >
            {{ period }}
          </button>
        }
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="flex items-center gap-2.5 justify-end px-6 py-4 bg-slate-50/80 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-800">
    <button
      type="button"
      (click)="dialogRef.close()"
      class="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:text-slate-800 dark:hover:text-white rounded-xl hover:bg-slate-200/60 dark:hover:bg-slate-700/60 transition-all active:scale-95 cursor-pointer"
    >
      Cancel
    </button>
    <button
      type="button"
      (click)="onConfirm()"
      class="px-5 py-2 text-xs font-bold text-white bg-gradient-to-r from-primary-600 to-primary-700 hover:from-primary-700 hover:to-primary-800 rounded-xl shadow-md shadow-primary-600/25 hover:shadow-lg hover:shadow-primary-600/35 transition-all duration-200 active:scale-95 flex items-center gap-1.5 cursor-pointer"
    >
      <span>Select</span>
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12l5 5L20 7"/>
      </svg>
    </button>
  </div>
</div>
