<div class="overflow-auto scroll-thin" [ngClass]="{
    'h-[calc(100vh-170px-72px)] overflow-y-auto': isCollapsed()
  }">
  <table mat-table [dataSource]="data()" class="w-full table">

    <!-- Sl -->
    <ng-container matColumnDef="sl">
      <th mat-header-cell *matHeaderCellDef>#</th>
      <td mat-cell *matCellDef="let row; let i = index" class="px-3 py-1.5 text-[13px] font-medium dark:text-slate-300">
        {{ i + 1 }}
      </td>
    </ng-container>

    <!-- Employee Name -->
    <ng-container matColumnDef="employeeName">
      <th mat-header-cell *matHeaderCellDef>Employee Name</th>
      <td mat-cell *matCellDef="let item" class="px-3 py-1.5 text-[13px] font-medium dark:text-slate-300">
        {{ item.employeeName }}
      </td>
    </ng-container>

    <!-- Leave Type -->
    <ng-container matColumnDef="leaveType">
      <th mat-header-cell *matHeaderCellDef>Leave Type</th>
      <td mat-cell *matCellDef="let item" class="px-3 py-1.5 text-[13px] font-medium dark:text-slate-300">
        {{ item.leaveType }}
      </td>
    </ng-container>

    <!-- From Date -->
    <ng-container matColumnDef="fromDate">
      <th mat-header-cell *matHeaderCellDef>From Date</th>
      <td mat-cell *matCellDef="let item"> {{ item.fromDate | date }} </td>
    </ng-container>

    <!-- To Date -->
    <ng-container matColumnDef="toDate">
      <th mat-header-cell *matHeaderCellDef>To Date</th>
      <td mat-cell *matCellDef="let item"> {{ item.toDate | date }} </td>
    </ng-container>

    <!-- Total Days -->
    <ng-container matColumnDef="totalDays">
      <th mat-header-cell *matHeaderCellDef>Total Days</th>
      <td mat-cell *matCellDef="let item" class="px-3 py-1.5 text-[13px] font-medium dark:text-slate-300">
        {{ item.totalDays }}
      </td>
    </ng-container>

    <!-- Action -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef class="text-right!">Actions</th>
      <td mat-cell *matCellDef="let item">
        <div class="w-full flex justify-end">
          <div class="flex items-center justify-center rounded-full cursor-pointer w-9 h-9 hover:bg-primary-400/10"
            matTooltip="View" (click)="onDetailView(item.leaveRequestId)">
            <svg lucideIcon="chevron-right"
              class="w-5 h-5 text-primary-500 dark:text-primary-500 hover:text-primary-600"></svg>
          </div>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns" [class.bg-primary-500]="selectedId() === row.id"
      [class.bg-opacity-10]="selectedId() === row.id" class="transition-colors">
    </tr>

    <tr class="mat-row" *matNoDataRow [attr.colspan]="columns.length">
      <td class="mat-cell px-8 text-center! text-slate-400 border-b-0" [attr.colspan]="columns.length">
        <div class="flex justify-center items-center gap-2">
          <svg lucideIcon="triangle-alert" class="w-5 h-5 text-slate-400"></svg>
          No records found.
        </div>
      </td>
    </tr>
  </table>
</div>
