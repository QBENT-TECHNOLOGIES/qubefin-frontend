<div class="space-y-2 animate-fade-in">
  @if (isEditMode() && loading()) {
  <div class="rounded-xl border border-dashed border-slate-300 dark:border-slate-700 p-6 text-sm text-slate-500">
    Loading leave prayer details...
  </div>
  } @else {

  <div class="flex items-center gap-2">
    <h3 class="text-base font-bold text-slate-800 dark:text-white">
      Leave Prayer Information
    </h3>
  </div>
  <div class="w-10 h-1 rounded-full bg-primary-500 mt-2 mb-4"></div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Leave Type</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="tag" class="w-5 h-5"></svg>
      </div>
      <mat-select [formField]="leavePrayerForm.leaveTypeId" (selectionChange)="updateType($event.value)">
        @for (balance of leaveTypeBalances(); track balance.leaveTypeId) {
        <mat-option [value]="balance.leaveTypeId">{{ balance.title }} </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Prayer Days</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="file-text" class="w-5 h-5"></svg>
      </div>
      <input type="number" matInput [formField]="leavePrayerForm.prayerDays" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full md:col-span-3">
      <mat-label>Remarks</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="file-text" class="w-5 h-5"></svg>
      </div>
      <input matInput [formField]="leavePrayerForm.remarks" rows="3" />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full md:col-span-3">
      <mat-label>Document Upload</mat-label>
      <div class="w-12 flex justify-center" matPrefix>
        <svg lucideIcon="paperclip" class="w-5 h-5 text-slate-500"></svg>
      </div>
      <input matInput [value]="selectedFile()?.name || (documentUrl() ? 'Current document available' : '')" readonly
        placeholder="No file chosen" />
      <input hidden (change)="onFileSelected($event)" #fileInput accept="image/*,.pdf" type="file">

      <div matSuffix class="flex items-center gap-2 pr-1.5 py-1">
        @if (selectedFile()) {
        <button type="button" mat-icon-button (click)="removeFile()" class="text-rose-500">
          <svg lucideIcon="x" class="w-4 h-4"></svg>
        </button>
        }

        <button type="button"
          class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition-colors border border-slate-200 dark:border-slate-700 cursor-pointer"
          (click)="fileInput.click()">
          <svg lucideIcon="upload" class="w-3.5 h-3.5"></svg>
          Choose File
        </button>

        @if (documentUrl()) {
        <button type="button" (click)="openDocument()"
          class="bg-primary-50 hover:bg-primary-100 dark:bg-primary-900/20 dark:hover:bg-primary-900/40 text-primary-600 dark:text-primary-400 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition-colors border border-primary-200 dark:border-primary-800/30 cursor-pointer">
          <svg lucideIcon="eye" class="w-3.5 h-3.5"></svg>
          View
        </button>
        }
      </div>
    </mat-form-field>
  </div>

  <div class="border-t border-slate-200 dark:border-slate-400/10 py-2 flex justify-end gap-3 mt-6">
    <button type="button" (click)="onCancelClicked()"
      class="bg-white shadow rounded-lg px-4 py-2.5 flex items-center gap-2 text-sm font-medium hover:shadow-glass transition lift shine-sweep cursor-pointer">
      <svg lucideIcon="x" class="w-4 h-4"></svg>
      Cancel
    </button>
    <button type="button" (click)="onSubmit()"
      class="ripple-btn shadow shine-sweep rounded-lg px-5 py-2.5 flex items-center gap-2 text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-secondary-500 hover:shadow-glow transition lift cursor-pointer">
      <svg lucideIcon="send" class="w-4 h-4"></svg>
      Apply
    </button>
  </div>
  }
</div>
