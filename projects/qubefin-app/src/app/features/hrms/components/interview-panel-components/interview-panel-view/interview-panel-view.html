<div class="text-slate-600 text-sm space-y-4">
    <p>Panel Actions for ID: {{ panelId() }}</p>
    
    <div class="mt-4 flex gap-3">
        <button class="bg-blue-600 text-white px-3 py-1.5 rounded text-xs hover:bg-blue-700 transition" (click)="onAcknowledge()">
            Acknowledge
        </button>
        <button class="bg-green-600 text-white px-3 py-1.5 rounded text-xs hover:bg-green-700 transition" (click)="onMarkAttendance(true)">
            Mark Attended
        </button>
        <button class="bg-purple-600 text-white px-3 py-1.5 rounded text-xs hover:bg-purple-700 transition" (click)="onOpenAssessment()">
            Submit Assessment
        </button>
    </div>
</div>
