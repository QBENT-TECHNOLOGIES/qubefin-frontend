<div class="overflow-auto scroll-thin" [ngClass]="{
        'h-[calc(100vh-170px-72px)] overflow-y-auto': isCollapsed()
    }">

    <table mat-table [dataSource]="data() || []" class="w-full">
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Name </th>
            <td mat-cell *matCellDef="let item" class="px-3 py-1.5 text-[13px] font-medium dark:text-slate-300">
                {{ item.name }}
            </td>
        </ng-container>
        <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef> Code </th>
            <td mat-cell *matCellDef="let item"> {{ item.code }} </td>
        </ng-container>
        <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef> Category </th>
            <td mat-cell *matCellDef="let item"> {{ item.categoryName }} </td>
        </ng-container>
        <ng-container matColumnDef="taxable">
            <th mat-header-cell *matHeaderCellDef> Taxable </th>
            <td mat-cell *matCellDef="let item">
                @if (item.isTaxable) {
                <svg lucideIcon="check" matTooltip="Yes" class="w-5 h-5 text-green-600"></svg>
                } @else {
                <svg lucideIcon="x" matTooltip="No" class="w-5 h-5 text-red-600"></svg>
                }
            </td>
        </ng-container>
        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Status </th>
            <td mat-cell *matCellDef="let item">
                <span class="px-2 py-1 text-xs rounded font-medium" [class.bg-green-100]="item.isActive"
                    [class.text-green-800]="item.isActive" [class.bg-red-100]="!item.isActive"
                    [class.text-red-800]="!item.isActive">
                    {{ item.isActive ? 'Active' : 'Inactive' }}
                </span>
            </td>
        </ng-container>

        <!-- Action Column -->
        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="text-right"> Action </th>
            <td mat-cell *matCellDef="let item">
                <div class="w-full flex justify-end">
                    <div class="flex items-center justify-center rounded-full cursor-pointer w-9 h-9 hover:bg-primary-400/10"
                        matTooltip="View" (click)="onDetailView(item.id)">
                        <svg lucideIcon="chevron-right"
                            class="w-5 h-5 text-primary-500 dark:text-primary-500 hover:text-primary-600"></svg>
                    </div>
                </div>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns();" [class.bg-primary-500]="selectedId() === row.id"
            [class.bg-opacity-10]="selectedId() === row.id" class="transition-colors">
        </tr>
        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell text-center p-8 italic text-gray-500 border-b-0"
                [attr.colspan]="displayedColumns().length">
                No salary components found.
            </td>
        </tr>
    </table>
</div>
